<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palit dashboard</title>
<link rel="stylesheet" href="../system/components.css">
<style>
  /* The Palit dashboard, built in the design system's own language (A26, A30–A36): white paper,
     ink rules, square corners and unbolded SF Pro. Three pages, grouped the way Noah asked:
     the plan, the work, and the video. Screens come first; reasoning and research sit under them. */
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--chrome); color: var(--ink); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-underline-offset: 2px; text-decoration-color: rgba(29, 29, 31, 0.3); }
  a:hover { text-decoration-color: currentColor; }
  p, h1, h2, h3, h4, figure, blockquote, dl, dd { margin: 0; }
  ul, ol { margin: 0; padding: 0; }
  [id] { scroll-margin-top: 72px; }
  .wrap { max-width: 1320px; margin: 0 auto; padding-left: 32px; padding-right: 32px; }

  /* Header */
  .top { position: sticky; top: 0; z-index: 10; background: var(--paper); border-bottom: 1px solid var(--rule); }
  .top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-top: 10px; padding-bottom: 10px; }
  .brand { text-decoration: none; }
  .brand span { color: var(--ink-2); margin-left: 6px; }
  .nav { display: flex; border: 1px solid var(--rule); }
  .nav a { padding: 4px 16px; font-size: 13px; text-decoration: none; border-right: 1px solid var(--rule); background: var(--paper); }
  .nav a:last-child { border-right: 0; }
  .nav a:hover { background: var(--chrome); }
  .nav a[aria-current="page"] { background: var(--ink); color: var(--paper); }
  .when { margin-left: auto; font-size: 13px; color: var(--ink-2); }

  /* Page head */
  .phead { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 32px; align-items: end; padding: 36px 0 14px; border-bottom: 1px solid var(--rule); }
  .phead h1 { font-size: clamp(52px, 7vw, 88px); line-height: 0.92; letter-spacing: -0.04em; font-weight: 400; }
  .phead p { color: var(--ink-2); max-width: 60ch; }
  .jump { display: flex; flex-wrap: wrap; gap: 2px 14px; margin-top: 8px; font-size: 13px; }

  /* Sections */
  .sec { padding-top: 36px; }
  .sh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin-bottom: 12px; }
  .sh h2 { font-size: 30px; letter-spacing: -0.025em; font-weight: 400; line-height: 1.05; }
  .sh p { color: var(--ink-2); font-size: 13px; max-width: 70ch; }
  .sh .end { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; }
  .well { background: var(--paper); border: 1px solid var(--rule); }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .split > * + * { border-left: 1px solid var(--rule); }
  .pad { padding: 14px 18px 16px; }
  .k { display: block; font-size: 11px; color: var(--ink-2); margin-bottom: 6px; }
  .cap, .caption { font-size: 13px; color: var(--ink-2); }
  .rows > li { list-style: none; padding: 8px 0; border-top: 1px solid var(--rule-soft); }
  .rows > li:first-child { border-top: 0; padding-top: 0; }
  .t { display: block; }
  .s { display: block; font-size: 13px; color: var(--ink-2); }
  .tag, .pill { display: inline-block; font-size: 11px; line-height: 16px; padding: 0 5px; border: 1px solid var(--rule); white-space: nowrap; vertical-align: 1px; color: var(--ink); background: var(--paper); }
  .tag.solid, .pill.solid { background: var(--ink); color: var(--paper); }
  .tag.soft, .pill.quiet { border-color: var(--rule-soft); color: var(--ink-2); }
  .tag.dash, .pill.dashed { border-style: dashed; }
  .chips { display: inline-flex; flex-wrap: wrap; gap: 4px; vertical-align: middle; }
  .chip { display: inline-block; font-size: 11px; line-height: 16px; padding: 0 5px; border: 1px solid var(--rule-soft); text-decoration: none; color: var(--ink-2); background: var(--paper); }
  a.chip:hover { border-color: var(--ink); color: var(--ink); }
  .btn { font-family: var(--font); text-decoration: none; display: inline-block; color: var(--ink); }
  .btn.primary { background: var(--ink); color: var(--paper); }
  .btn.primary:hover { background: #3A3A3D; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .grow { flex: 1; }
  .empty { padding: 16px; border: 1px dashed var(--ink-3); color: var(--ink-2); font-size: 13px; background: var(--paper); }
  .quote { border-left: 2px solid var(--ink); padding-left: 10px; font-size: 13px; }
  .quote cite { display: block; font-style: normal; font-size: 11px; color: var(--ink-2); margin-top: 2px; }

  /* Folds: everything secondary opens on demand */
  details.fold { background: var(--paper); border: 1px solid var(--rule); }
  details.fold + details.fold { border-top: 0; }
  details.fold > summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; padding: 11px 16px; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::before { content: "+"; width: 12px; color: var(--ink-2); }
  details.fold[open] > summary::before { content: "−"; }
  details.fold > summary .ft { font-size: 17px; letter-spacing: -0.01em; }
  details.fold > summary .fs { font-size: 13px; color: var(--ink-2); }
  details.fold > summary:hover .ft { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(29, 29, 31, 0.3); }
  .fb { padding: 2px 16px 18px 40px; }
  .fb > * + * { margin-top: 12px; }

  /* The older renderers' pieces, in the same language */
  .card { background: var(--paper); border-top: 1px solid var(--rule-soft); padding: 12px 0 0; }
  .fb > .card:first-child { border-top: 0; padding-top: 0; }
  .card > h2, .card h2 { font-size: 15px; font-weight: 400; margin: 0 0 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0 24px; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 24px; }
  .head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .head h3 { flex: 1; font-size: 15px; font-weight: 400; }
  .letter { font-size: 11px; color: var(--ink-2); min-width: 18px; }
  .meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
  .meta .kind { color: var(--ink); }
  .meta .end { margin-left: auto; }
  dl.facts { display: grid; gap: 6px; margin-top: 8px; }
  dl.facts dt { font-size: 11px; color: var(--ink-2); }
  dl.facts dd { font-size: 13px; }
  ul.bullets, ol.bullets { padding-left: 18px; font-size: 13px; }
  ul.bullets li, ol.bullets li { margin: 2px 0; }
  ul.plain { list-style: none; }
  ul.plain > li { padding: 7px 0; border-top: 1px solid var(--rule-soft); font-size: 13px; }
  ul.plain > li:first-child { border-top: 0; }
  .callout { border: 1px dashed var(--ink-3); padding: 8px 12px; font-size: 13px; }
  .line { border-left: 2px solid var(--ink); padding-left: 10px; font-size: 14px; }
  .line .label { display: block; font-size: 11px; color: var(--ink-2); }
  .tablewrap { overflow-x: auto; border-top: 1px solid var(--rule); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; font-weight: 400; color: var(--ink-2); font-size: 11px; padding: 6px 8px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  td { padding: 6px 8px; border-bottom: 1px solid var(--rule-soft); vertical-align: top; min-width: 110px; }
  td.tight { min-width: 0; white-space: nowrap; }
  .seg-ctl { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--rule); }
  .seg-ctl button { border: 0; border-right: 1px solid var(--rule); background: var(--paper); padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .seg-ctl button:last-child { border-right: 0; }
  .seg-ctl button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .refs { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .ref { border: 0; padding: 0; }
  .ref .img { display: block; aspect-ratio: 4 / 3; background: var(--chrome); border: 1px solid var(--rule); overflow: hidden; }
  .ref .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ref .body { padding: 8px 0 0; font-size: 13px; }
  .ref h3 { font-size: 15px; font-weight: 400; }
  .links { display: inline-flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; }
  .foot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
  .why { border-left: 2px solid var(--ink); padding: 2px 0 2px 10px; font-size: 13px; }
  .why .label { display: block; font-size: 11px; color: var(--ink-2); }
  .why .src { display: block; font-size: 11px; color: var(--ink-2); margin-top: 2px; }
  .why .said { white-space: pre-line; }
  .why.agent, .why.missing { border-left: 2px dashed var(--ink-3); }
  .ask { display: block; margin-top: 2px; }
  .shift { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; font-size: 13px; }
  .shift > div { border-top: 1px solid var(--rule-soft); padding-top: 6px; }
  .shift .label { display: block; font-size: 11px; color: var(--ink-2); }
  .shift .arrow { align-self: center; color: var(--ink-2); }
  .revision { font-size: 12px; color: var(--ink-2); }
  .shots { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; list-style: none; }
  .shots a { display: block; aspect-ratio: 1; overflow: hidden; border: 1px solid var(--rule-soft); }
  .shots img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* Plan: the four days */
  .days { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .days > div { padding: 12px 14px 14px; border-right: 1px solid var(--rule); }
  .days > div:last-child { border-right: 0; }
  .days .d { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .days .f { font-size: 17px; letter-spacing: -0.01em; margin-top: 4px; }
  .days .past { color: var(--ink-2); }
  .days .now { background: var(--ink); color: var(--paper); }
  .days .now .s, .days .now .k { color: #C9C9CD; }
  .days ul { list-style: none; margin-top: 8px; font-size: 13px; }
  .days li + li { margin-top: 3px; }
  .ns p { font-size: 19px; line-height: 1.45; letter-spacing: -0.005em; }
  .ns p + p { margin-top: 10px; }
  .composer textarea { width: 100%; min-height: 110px; resize: vertical; padding: 8px 10px; border: 1px solid var(--rule-soft); background: var(--paper); font: 13px/1.45 var(--font); margin: 8px 0; }
  .composer textarea:focus, .notes textarea:focus { border-color: var(--ink); outline: none; }
  .composer select, .notes select { font: 13px var(--font); padding: 3px 6px; border: 1px solid var(--rule); background: var(--paper); border-radius: 0; max-width: 100%; }

  /* Plan: the timeline */
  .tl-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 10px; font-size: 13px; }
  .tl-ctl label { display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); }
  .tl-ctl input { accent-color: var(--ink); }
  .tl-day { background: var(--paper); border: 1px solid var(--rule); }
  .tl-day + .tl-day { margin-top: 12px; }
  .tl-day > h3 { font-size: 13px; font-weight: 400; color: var(--ink-2); padding: 8px 16px; border-bottom: 1px solid var(--rule); }
  details.entry { border-top: 1px solid var(--rule-soft); }
  details.entry:first-of-type { border-top: 0; }
  details.entry > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 34px 92px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 8px 16px; font-size: 14px; }
  details.entry > summary::-webkit-details-marker { display: none; }
  details.entry > summary:hover { background: var(--chrome); }
  details.entry[open] > summary { background: var(--chrome); }
  details.entry:target > summary, details.entry.hit > summary { box-shadow: inset 2px 0 0 var(--ink); }
  details.entry .no { font-size: 11px; color: var(--ink-2); }
  details.entry .kd { font-size: 11px; color: var(--ink-2); }
  details.entry .ti { min-width: 0; }
  details.entry .rt { display: flex; gap: 4px; align-items: baseline; flex-wrap: wrap; justify-content: flex-end; }
  .eb { padding: 4px 16px 16px 152px; }
  .eb > * + * { margin-top: 10px; }

  /* Work: previews of real pages */
  .pv { position: relative; overflow: hidden; background: var(--chrome); border-bottom: 1px solid var(--rule); }
  .pv.wide { aspect-ratio: 16 / 9; }
  .pv.tall { aspect-ratio: 16 / 10; }
  .pv iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; pointer-events: none; background: #FFFFFF; }
  .pv-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .pv-open { position: absolute; inset: 0; font-size: 0; }
  .pv-open:hover { box-shadow: inset 0 0 0 2px var(--ink); }
  .pv-note { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; color: var(--ink-2); padding: 12px; text-align: center; }

  .work { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
  .protos { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); border-top: 1px solid var(--rule); border-left: 1px solid var(--rule); }
  .proto { background: var(--paper); border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .proto .pb { padding: 10px 12px 12px; }
  .proto h3 { font-size: 17px; font-weight: 400; letter-spacing: -0.01em; }
  .proto p { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
  .proto .links { margin-top: 6px; }

  .grp + .grp { margin-top: 20px; }
  .grp > h3 { font-size: 13px; font-weight: 400; color: var(--ink-2); margin-bottom: 8px; }
  .scrs { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); border-top: 1px solid var(--rule); border-left: 1px solid var(--rule); list-style: none; }
  .scr { background: var(--paper); border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; }
  .scr:target { box-shadow: inset 0 0 0 2px var(--ink); }
  .scr .sb { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .scr .sn { font-size: 11px; color: var(--ink-2); }
  .scr h4 { font-size: 17px; font-weight: 400; letter-spacing: -0.01em; line-height: 1.2; }
  .scr .sd { font-size: 13px; color: var(--ink-2); }
  .scr .sf { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: auto; padding-top: 4px; }
  .mini { font-size: 11px; background: none; border: 1px solid var(--rule-soft); padding: 0 6px; line-height: 16px; cursor: pointer; color: var(--ink-2); }
  .mini:hover { border-color: var(--ink); color: var(--ink); }
  details.more > summary { list-style: none; cursor: pointer; font-size: 12px; color: var(--ink); }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary::before { content: "+ "; color: var(--ink-2); }
  details.more[open] > summary::before { content: "− "; }
  details.more > div { margin-top: 6px; font-size: 12px; }
  details.more .dr { border: 1px dashed var(--ink-3); padding: 6px 8px; }
  ul.research { list-style: none; }
  ul.research li { padding: 6px 0; border-top: 1px solid var(--rule-soft); }
  ul.research .rl { display: block; font-size: 11px; color: var(--ink-2); }
  ul.research .rs { display: block; font-size: 11px; color: var(--ink-2); }

  .v2-top { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 28px; padding: 18px 20px; margin-bottom: 18px; background: var(--paper); border: 1px solid var(--rule-soft); }
  .v2-q .quote + .quote { margin-top: 14px; }
  .fbbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 14px; margin: 0 0 16px; background: var(--paper); border: 1px solid var(--rule-soft); }
  .fbbar .grow { flex: 1; }
  .fbbar select { font: 13px var(--font); }
  .fbta { display: block; width: 100%; min-height: 64px; margin-top: 6px; resize: vertical; padding: 7px 9px; border: 1px solid var(--rule-soft); background: var(--paper); font: 13px/1.45 var(--font); box-sizing: border-box; }
  .fbta:focus { outline: none; border-color: var(--ink); }
  details.fb[open] > summary, details.fb.has > summary { color: var(--ink); }
  @media (max-width: 860px) { .v2-top { grid-template-columns: 1fr; } }
  .rounds { list-style: none; }
  .round { background: var(--paper); border: 1px solid var(--rule); padding: 12px 14px 14px; }
  .round + .round { border-top: 0; }
  .round:target { box-shadow: inset 2px 0 0 var(--ink); }
  .round .rh { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
  .round .rh h3 { font-size: 17px; font-weight: 400; letter-spacing: -0.01em; }
  .round .rh .s { display: inline; }
  .round .rh .end { margin-left: auto; font-size: 11px; color: var(--ink-2); }
  .round .rt { font-size: 13px; margin-top: 2px; }
  .round .quote { margin-top: 8px; }
  .round.slim { background: transparent; border-style: dashed; }
  .round + .round.slim, .round.slim + .round { border-top: 1px dashed var(--rule); }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; list-style: none; }
  .thumbs .pv { border: 1px solid var(--rule); }
  .thumbs .s { font-size: 11px; margin-top: 3px; }
  .thumbs li.hide { display: none; }

  /* Work: the notes panel */
  .notes { position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow: auto; background: var(--paper); border: 1px solid var(--rule); }
  .notes .nh { padding: 12px 14px 10px; border-bottom: 1px solid var(--rule); }
  .notes .nh h2 { font-size: 22px; font-weight: 400; letter-spacing: -0.02em; }
  .notes form { padding: 10px 14px 12px; border-bottom: 1px solid var(--rule); display: grid; gap: 8px; }
  .notes textarea { width: 100%; min-height: 80px; resize: vertical; padding: 6px 8px; border: 1px solid var(--rule-soft); font: 13px/1.45 var(--font); }
  .notes ol { list-style: none; padding: 4px 14px 8px; }
  .notes li { padding: 8px 0; border-top: 1px solid var(--rule-soft); font-size: 13px; }
  .notes li:first-child { border-top: 0; }
  .notes li .ab { display: block; font-size: 11px; color: var(--ink-2); }
  .notes li .x { float: right; }
  .notes .nf { padding: 10px 14px 14px; border-top: 1px solid var(--rule); }

  /* Video */
  .vbar { display: flex; gap: 0; height: 40px; border: 1px solid var(--rule); background: var(--paper); }
  .vbar a { flex-basis: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; text-decoration: none; border-right: 1px solid var(--rule); min-width: 0; overflow: hidden; }
  .vbar a:last-child { border-right: 0; }
  .vbar a.product { background: var(--ink); color: var(--paper); border-right-color: var(--paper); }
  .vbar a:hover { opacity: 0.85; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; border: 1px solid var(--rule); }
  /* Storyboards: frames in reading order, square and ruled like the archive */
  .sb-block + .sb-block { margin-top: 32px; }
  .sb-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
  .sb-head h3 { font-size: 17px; font-weight: 400; }
  .sb { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); border-top: 1px solid var(--rule); border-left: 1px solid var(--rule); margin-top: 12px; }
  .sb-shot { display: flex; flex-direction: column; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); background: var(--paper); }
  .sb-meta { display: grid; gap: 5px; padding: 8px 10px 12px; font-size: 12px; }
  .sb-t { font-size: 11px; color: var(--ink-2); }
  .sb-title { font-size: 14px; }
  .sb-said { font-size: 13px; }
  .sb-said .k { display: block; font-size: 11px; color: var(--ink-2); }
  .sb-needs { font-size: 12px; border-left: 2px dashed var(--ink-3); padding-left: 8px; }
  .sb-card { position: absolute; inset: 0; display: grid; place-items: center; padding: 8% 10%; text-align: center; font-size: 15px; line-height: 1.3; background: var(--paper); }
  .sb-grid4 { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 1px; background: var(--rule); }
  .sb-grid4 img { width: 100%; height: 100%; min-height: 0; object-fit: cover; object-position: top; display: block; }
  .speak { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 24px; align-items: start; }
  .stage16 { position: relative; aspect-ratio: 16 / 9; border: 1px solid var(--rule); overflow: hidden; background: var(--desk); container-type: inline-size; }
  .stage16 iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; pointer-events: none; }
  .spk { position: absolute; z-index: 2; display: inline-grid; grid-template-columns: 1.4cqw auto; gap: 0.8cqw; align-items: center; background: var(--paper); border: 1px solid var(--rule); padding: 0.7cqw 1.2cqw 0.7cqw 0.7cqw; font-size: 1.6cqw; line-height: 1; }
  .spk i { width: 1.4cqw; height: 1.4cqw; background: var(--ink); }
  .spk.tl { left: 2.5cqw; top: 2.5cqw; } .spk.tr { right: 2.5cqw; top: 2.5cqw; } .spk.bl { left: 2.5cqw; bottom: 2.5cqw; } .spk.br { right: 2.5cqw; bottom: 2.5cqw; }

  .dive.picked h3 { font-size: 30px; letter-spacing: -0.025em; }

  .beats { padding-left: 18px; font-size: 14px; }
  .beats li + li { margin-top: 4px; }
  .arc { list-style: none; border-left: 1px solid var(--ink); margin: 4px 0 2px 3px; padding-left: 12px; font-size: 13px; }
  .arc li { position: relative; padding: 2px 0; }
  .arc li::before { content: ""; position: absolute; left: -16px; top: 9px; width: 7px; height: 7px; background: var(--paper); border: 1px solid var(--ink); }
  .arc a { font-size: 11px; color: var(--ink-2); margin-right: 6px; text-decoration: none; }
  .arc a:hover { color: var(--ink); text-decoration: underline; }

  @media (max-width: 1100px) {
    .work, .speak { grid-template-columns: 1fr; }

  }

  }

<body>
  <header class="top">

  <footer class="wrap" style="padding:40px 0 64px;font-size:12px;color:var(--ink-2)">

  </footer>

<script src="../system/handoff.js"></script>

<script>
(function () {
  "use strict";
  var P = window.PALIT || {};
  var C = P.compass || {}, V = P.video || {}, R = P.research || {}, T = P.testing || {},
      S = P.sessions || {}, I = P.inspiration || {}, D = P.decisions || {}, SC = P.screens || {};

  /* ---------- Helpers ---------- */

  function el(tag, attrs, kids) {

  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function parseISO(iso) { var p = iso.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function localISO(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function fmtLong(iso) { return parseISO(iso).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" }); }
  function fmtShort(iso) { return parseISO(iso).toLocaleDateString("en-US", { month: "short", day: "numeric" }); }
  function weekday(iso) { return parseISO(iso).toLocaleDateString("en-US", { weekday: "long" }); }

    catch (e) { return f; }
  }
  function save(k, v) { try { localStorage.setItem("palit-process-" + k, JSON.stringify(v)); } catch (e) {} }
  function isExternal(h) { return /^https?:/.test(h); }
  function link(label, href, cls) {
    var a = el("a", { href: href, text: label, class: cls || null });
    if (isExternal(href)) { a.target = "_blank"; a.rel = "noopener"; }
    return a;
  }
  function openLink(label, href, cls) { var a = link(label, href, cls); a.target = "_blank"; a.rel = "noopener"; return a; }
  function domain(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return u; } }
  function bullets(items, cls) { return el("ul", { class: cls || "bullets" }, (items || []).map(function (i) { return el("li", null, [i]); })); }
  function paras(text) { return String(text).split(/\n\s*\n/).map(function (p) { return el("p", { text: p.trim(), style: "margin-top:8px;font-size:14px" }); }); }

    });
    return dl;
  }
  function empty(text) { return el("div", { class: "empty", text: text }); }
  // A main section: open, with a heading.
  function sec(id, title, hint, kids, end) {
    return el("section", { class: "sec", id: id }, [el("div", { class: "sh" }, [el("h2", { text: title }), hint ? el("p", { text: hint }) : null, end ? el("span", { class: "end" }, end) : null])].concat(kids || []));
  }
  // A secondary section: folded until you open it. The older renderers call this.
  function section(id, title, hint, kids) {
    return el("details", { class: "fold", id: id }, [

      el("div", { class: "fb" }, kids || [])
    ]);
  }

  var STATUS = {
    approved: ["Approved", "solid"], working: ["Working pick", ""], proposed: ["Proposed", "dashed"],
    done: ["Done", "quiet"], open: ["Open", "dashed"], replaced: ["Replaced", "quiet"], "set-aside": ["Set aside", "quiet"],
    hypothesis: ["Hypothesis", "dashed"], draft: ["Draft", ""], candidates: ["Candidates", "dashed"],
    candidate: ["Candidate", "dashed"], chosen: ["Chosen", "solid"], dropped: ["Dropped", "quiet"], locked: ["Locked", "solid"],
    planned: ["Planned", "dashed"], running: ["Running", ""], upcoming: ["Upcoming", "dashed"], idea: ["Idea", "dashed"],
    blocked: ["Waiting", "dashed"], research: ["Needs research", "dashed"], ready: ["Ready", "solid"],
    unverified: ["Unverified", "dashed"], "partly supported": ["Partly supported", ""], supported: ["Supported", "solid"],
    disproved: ["Disproved", "quiet"], "Noah's direction": ["Noah's direction", ""],
    high: ["High", "solid"], medium: ["Medium", ""], low: ["Low", "dashed"]
  };
  function statusPill(s) { var m = STATUS[s] || [s, ""]; return el("span", { class: "pill" + (m[1] ? " " + m[1] : ""), text: m[0] }); }

  function copyText(s, done) {
    function fallback() {
      var t = el("textarea", { readonly: "" });
      t.value = s; t.style.position = "fixed"; t.style.opacity = "0";
      document.body.appendChild(t); t.select();

    else fallback();
  }

  /* ---------- Shared data ---------- */

  var entries = (D.entries || []).map(function (e, i) { return Object.assign({ no: i + 1 }, e); });
  var byNo = {};
  entries.forEach(function (e) { byNo[e.no] = e; });
  var revisedBy = {};
  entries.forEach(function (e) { if (e.revises) revisedBy[e.revises] = e.no; });
  function waitingOnWhy(e) { return !revisedBy[e.no] && (e.whyStatus === "missing" || e.whyStatus === "agent"); }
  var waiting = entries.filter(waitingOnWhy);

  var rockById = {};
  (C.rocks || []).forEach(function (r) { rockById[r.id] = r; });
  function tagLabel(t) {
    if (t.indexOf("rock:") === 0) { var r = rockById[t.slice(5)]; return "Big rock " + t.slice(5) + (r ? ": " + r.title : ""); }
    var b = (V.blocks || []).filter(function (x) { return (x.tags || []).indexOf(t) >= 0; })[0];
    return b ? b.title : t;
  }
  function tagHref(t) {
    if (t.indexOf("rock:") === 0) return "#compass/rocks";
    var b = (V.blocks || []).filter(function (x) { return (x.tags || []).indexOf(t) >= 0; })[0];
    return b ? "#video/" + b.id : "#video";
  }
  function entriesTagged(tags) { return entries.filter(function (e) { return (e.video || []).some(function (t) { return tags.indexOf(t) >= 0; }); }); }
  function entryLinks(list) {
    if (!list.length) return null;
    return el("ul", { class: "plain" }, list.map(function (e) { return el("li", null, [link("Entry " + pad(e.no), "#e" + pad(e.no)), ": " + e.title]); }));
  }
  function entryChips(nos) {
    return el("span", { class: "chips" }, (nos || []).map(function (n) {
      var e = byNo[n];
      return e ? el("a", { class: "chip num", href: "#e" + pad(n), title: e.title, text: "Entry " + pad(n) }) : null;
    }));
  }
  function hrefLabel(h) {
    if (/^#e\d+$/.test(h)) return "Entry " + h.slice(2);
    var map = { "#screens/journey": "The journey, on the Work page", "#video": "Video plan", "#research/audience": "Audience", "#research/interviews": "Interview kit", "#compass/rocks": "Big rocks", "#inspiration": "Inspiration" };
    return map[h] || "Open";
  }
  function latestUpdate() { return [C, V, SC, R, T, S, I, D].map(function (x) { return x.updated || ""; }).sort().pop(); }

  function countdown() {
    var tl = C.timeline || [];
    if (!tl.length) return "";
    var iso = localISO(new Date());
    var deadline = C.deadline || tl[tl.length - 1].date;
    var daysLeft = Math.round((parseISO(deadline) - parseISO(iso)) / 86400000);
    var idx = tl.map(function (d) { return d.date; }).indexOf(iso);
    if (idx >= 0) {
      var tail = daysLeft > 0 ? daysLeft + (daysLeft === 1 ? " day" : " days") + " to " + weekday(deadline) : "Deadline day";
      return weekday(iso) + ", day " + (idx + 1) + " of " + tl.length + ": " + tl[idx].focus + ". " + tail + ".";
    }
    if (iso < tl[0].date) return "Starts " + fmtLong(tl[0].date) + ".";
    return "Past the deadline.";
  }

  /* ---------- Decisions, as rows that open ---------- */

  var KINDS = [["all", "All"], ["pivot", "Pivots"], ["decision", "Decisions"], ["exploration", "Explorations"], ["feedback", "Feedback"], ["process", "Process"], ["question", "Questions"]];
  var KIND_ONE = { pivot: "Pivot", decision: "Decision", exploration: "Exploration", feedback: "Feedback", process: "Process", question: "Question" };
  var AREAS = { product: "Product", foundations: "Foundations", capture: "Capture", card: "Card", archive: "Archive", collect: "Collect", flows: "All flows", references: "References", process: "Process", name: "Name" };
  var WHY_LABEL = { noah: "Why", rule: "Why", agent: "Agent's reasoning", missing: "Why: not recorded yet" };
  var dstate = { kind: load("kind", "all"), onlyWhy: load("onlyWhy", false), newestFirst: load("newestFirst", true) };
  function saveD() { save("kind", dstate.kind); save("onlyWhy", dstate.onlyWhy); save("newestFirst", dstate.newestFirst); }
  function passes(e) {
    if (dstate.kind !== "all" && e.kind !== dstate.kind) return false;
    if (dstate.onlyWhy && !waitingOnWhy(e)) return false;
    return true;
  }
  function renderWhy(e) {
    var st = e.whyStatus || "missing";
    if (st === "na") return null;
    var box = el("div", { class: "why " + st }, [el("span", { class: "label", text: WHY_LABEL[st] })]);
    if (e.why && st !== "missing") box.appendChild(el("span", { class: "said", text: e.why }));
    if (st === "noah" && e.whySource) box.appendChild(el("span", { class: "src", text: e.whySource + (e.whyAdded && e.whyAdded !== e.date ? ", added " + e.whyAdded : "") }));
    if (st === "rule") box.appendChild(el("span", { class: "src", text: "From the project rules" + (e.whySource ? ": " + e.whySource : "") }));
    if (st === "agent") box.appendChild(el("span", { class: "src", text: "Noah's reason isn't recorded yet." }));
    if (e.ask) box.appendChild(el("span", { class: "ask" }, [el("b", { style: "font-weight:400;color:var(--ink-2)", text: st === "missing" || st === "agent" ? "Ask: " : "Still to ask: " }), e.ask]));
    return box;
  }
  function entryRow(e) {

    d.appendChild(el("summary", null, [
      el("span", { class: "no num", text: pad(e.no) }),
      el("span", { class: "kd", text: (KIND_ONE[e.kind] || e.kind) + (AREAS[e.area] ? ", " + AREAS[e.area].toLowerCase() : "") }),
      el("span", { class: "ti", text: e.title }),
      el("span", { class: "rt" }, [waitingOnWhy(e) ? el("span", { class: "tag dash", text: "Why?" }) : null, e.status ? statusPill(e.status) : null])
    ]));
    var b = el("div", { class: "eb" });
    var notes = [];
    if (revisedBy[e.no]) notes.push(["Updated by ", revisedBy[e.no]]);
    if (e.revises) notes.push(["Updates ", e.revises]);
    if (notes.length) b.appendChild(el("p", { class: "revision" }, notes.reduce(function (acc, n, i) {
      if (i) acc.push(". ");
      acc.push(n[0]); acc.push(el("a", { href: "#e" + pad(n[1]), class: "num", text: "entry " + pad(n[1]) }));
      return acc;
    }, [])));
    if (e.from || e.to) b.appendChild(el("div", { class: "shift" }, [
      el("div", null, [el("span", { class: "label", text: "Before" }), e.from || "—"]),
      el("span", { class: "arrow", "aria-hidden": "true", text: "→" }),
      el("div", null, [el("span", { class: "label", text: "After" }), e.to || "—"])
    ]));
    if (e.summary) b.appendChild(el("p", { style: "font-size:14px", text: e.summary }));
    var why = renderWhy(e);
    if (why) b.appendChild(why);
    if ((e.images || []).length) b.appendChild(el("ul", { class: "shots" }, e.images.map(function (img) {
      return el("li", null, [el("a", { href: img.src, title: img.alt }, [el("img", { src: img.src, alt: img.alt, loading: "lazy" })])]);
    })));
    var foot = el("div", { class: "foot" });
    if ((e.refs || []).length) foot.appendChild(el("span", { class: "chips" }, e.refs.map(function (r) { return el("span", { class: "chip num", text: r }); })));
    if (e.by) foot.appendChild(el("span", { text: e.by }));
    if ((e.links || []).length) foot.appendChild(el("span", { class: "links" }, e.links.map(function (l) { return link(l.label, l.href); })));
    if ((e.video || []).length) foot.appendChild(el("span", { class: "chips" }, ["Could feed: "].concat(e.video.map(function (t) { return link(tagLabel(t), tagHref(t), "chip"); }))));
    b.appendChild(foot);
    d.appendChild(b);
    return d;
  }

  /* ---------- Previews of real pages ---------- */

  var ro = null;
  function fitPreviews(list) {
    list.forEach(function (en) {
      var f = en.target.querySelector("iframe");
      if (!f) return;

  }
  function preview(href, label, wide, focus) {

  }
  // A screenshot of an archived page. Older explorations take focus and scroll the page when they

  }
  function findIn(list, keys, needle) {

  }
  // Research behind a screen, quoted from research.js and inspiration.js, never rewritten here.
  function researchItem(r) {
    var label = null, text = null, src = null;
    if (r.from === "sip") {
      text = ((I.competitor || {}).contend || []).filter(function (t) { return t.indexOf(r.find) >= 0; })[0];
      label = ["Against Sip"];
      src = link("Sip", "#inspiration/sip");
    } else if (r.from === "precedent") {
      var p = findIn(R.precedents, ["title", "text", "lesson"], r.find);

  }

  /* ---------- Pages ---------- */

  var PAGES = [
    { id: "plan", label: "Plan", render: renderPlan },
    { id: "work", label: "Work", render: renderWork },
    { id: "video", label: "Video", render: renderVideo }
  ];
  function head(title, text, jumps) {
    return el("div", { class: "phead" }, [
      el("h1", { text: title }),
      el("div", null, [el("p", { text: text }), jumps ? el("nav", { class: "jump", "aria-label": "On this page" }, jumps.map(function (j) { return link(j[0], j[1]); })) : null])
    ]);
  }

  /* Plan: the timeline, the to-do, the process and the deadlines */
  function renderPlan(view, anchor) {
    view.appendChild(head("Plan", "Where we are, what's waiting on you, and every move so far. The video is due " + fmtLong(C.deadline || "2026-10-19") + ".", [
      ["Deadlines", "#plan/days"], ["To do", "#plan/todo"], ["North star", "#plan/north"], ["The brief", "#compass/brief"], ["Timeline", "#plan/timeline"], ["More", "#plan/more"]
    ]));

    // Deadlines
