<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palit video visualizations</title>
<link rel="stylesheet" href="../system/components.css">
<style>
  /* The video's data visualizations (entry 182), in the design system's look: pure white, ink, unbolded SF Pro, and the
     colors from Palit's own archive as the only color. Each scene is drawn as a function of time, so the player can
     drive it frame by frame (PalitViz.render(t)) and an export can step through it. ?scene=problem (splash, brief, people,
     decisions, look, longtime, story, horizon, credits) and ?play to watch one on its own. The motion pops with a little overshoot, after heyclicky. */
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  body { font-family: var(--font); color: #1d1d1f; -webkit-font-smoothing: antialiased; }
  .num { font-variant-numeric: tabular-nums; }
  #frame { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform: translate(-50%, -50%); transform-origin: 50% 50%; background: #fff; overflow: hidden; }
  .a { position: absolute; will-change: transform, opacity; }
  .t-xl { font-size: 104px; line-height: 1.02; letter-spacing: -0.045em; }
  .t-l { font-size: 72px; line-height: 1.05; letter-spacing: -0.035em; }
  .t-m { font-size: 44px; line-height: 1.15; letter-spacing: -0.02em; }
  .t-s { font-size: 28px; line-height: 1.3; letter-spacing: -0.005em; }
  .t-xs { font-size: 22px; line-height: 1.3; color: #6b6b70; }
  .gray { color: #6b6b70; }
  .src { font-size: 22px; color: #6b6b70; }
  .chip { position: absolute; }
  .card { position: absolute; background: #fff; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(0, 0, 0, 0.06); }
  .win { position: absolute; border-radius: 14px; overflow: hidden; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.18), 0 0 0 1px rgba(0, 0, 0, 0.08); }
  .win .bar { height: 44px; display: flex; align-items: center; gap: 9px; padding: 0 16px; }
  .win .bar i { width: 13px; height: 13px; border-radius: 50%; background: #ff5f57; }
  .win .bar i:nth-child(2) { background: #febc2e; } .win .bar i:nth-child(3) { background: #28c840; }
  .win .bar b { margin-left: 12px; font-weight: 400; font-size: 20px; }
  .rule { position: absolute; height: 1px; background: #e6e6e8; }
  .dark { color: #fff; } .dark .t-xs, .dark .gray, .dark .src { color: #a1a1a6; }
  .hl { background: linear-gradient(var(--hl), var(--hl)) 0 0 / 0% 100% no-repeat; padding: 0 0.1em; margin: 0 -0.04em; }
  /* Nothing goes below y 880: the player's speaker chip and subtitle bar sit there */
  /* The reels: our own screens, each on a thin ink rule, square, no shadow (entry 206) */
  .rl-img { display: block; box-shadow: 0 0 0 1px rgba(29, 29, 31, 0.16); background: #fff; }
  .rl-ph { display: grid; place-content: center; gap: 12px; text-align: center; box-shadow: inset 0 0 0 2px #d2d2d7; background: #fff; }
  .rl-strike { position: absolute; left: 0; top: 50%; height: 2px; background: #1d1d1f; transform-origin: 0 50%; }
</style>
</head>
<body>
<div id="frame"></div>
<script src="../history/data/decisions.js"></script>
<script src="../history/data/research.js"></script>
<script src="../system/sample.js"></script>
<script src="../v3/archive.js"></script>
<script src="data/longtime.js"></script>
<script src="script.js"></script>
<script src="reels.js"></script>
<script src="../brand/brand.js"></script>
<script>
(function () {
  "use strict";
  var F = document.getElementById("frame"), q = new URLSearchParams(location.search);
  var OURS = { hyacinth: "#d14808", oxblood: "#6c2e3a", pool: "#2e6b6f", mango: "#f0c23b", lichen: "#a9b9a0", plum: "#5b3a63", bottle: "#1f3b2d", blue: "#4f7cac", brick: "#b5462e", blush: "#f3d9cf", rose: "#d9a7a0", sage: "#8bae7c", graphite: "#3b3f46", paper: "#f2ede4", taxi: "#d98e04", steel: "#7a8b99", lilac: "#c9b8e8", clay: "#c25a35", teal: "#2f5d62", gallery: "#e8e1d3" };
  var MIX = [OURS.hyacinth, OURS.pool, OURS.mango, OURS.plum, OURS.sage, OURS.oxblood, OURS.blue, OURS.blush, OURS.taxi, OURS.lilac, OURS.bottle, OURS.clay];

  /* ---------- Time helpers: everything is a function of t, so scrubbing and exporting just work ---------- */
  function k(t, t0, d) { return Math.max(0, Math.min(1, (t - t0) / (d || 0.4))); }
  // How things come in (entry 198, the video workshop): ?motion=spring (as built), snap (short, no overshoot), cut (no fade),
  // or step (in three steps, like stop motion)
  // Noah, October 19: “The text and how things appear is too janky - lets go back to smooth fades. I just want them to be
  // sequential” (entry 219, after the clunk of entry 215). fade is the default: opacity only, on v3's ease, one after another.
  // ?motion=clunk, spring, snap, cut or step still switch it, for the workshop.
  var MOTION = /^(spring|snap|cut|step|clunk|fade)$/.test(q.get("motion") || "") ? q.get("motion") : "fade";
  function prog(t, t0, d) {
    if (MOTION === "cut") return t >= t0 ? 1 : 0;
    if (MOTION === "clunk") return t < t0 ? 0 : t < t0 + 0.07 ? 0.5 : 1;
    var x = k(t, t0, MOTION === "snap" ? Math.min(d || 0.4, 0.22) : d);
    return MOTION === "step" ? Math.floor(x * 3 + 1e-6) / 3 : x;
  }
  function outBack(x) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
  function outCubic(x) { return 1 - Math.pow(1 - x, 3); }
  function inOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  // A springy pop in at t0 and, if given, a fade out at t1
  function pop(n, t, t0, t1, from) {
    var x = prog(t, t0, 0.45), f = from === undefined ? 0.6 : from, spring = MOTION === "spring";
    if (MOTION === "fade") { var of = outCubic(x); if (t1 !== undefined) of *= 1 - outCubic(prog(t, t1, 0.35)); n.style.opacity = of; n.style.transform = n._base || ""; return; }
    if (MOTION === "clunk") {   // two frames: there and a touch big, then in place
      var o0 = x > 0 ? 1 : 0; if (t1 !== undefined && t >= t1) o0 = t < t1 + 0.07 ? 0.4 : 0;
      n.style.opacity = o0; n.style.transform = (n._base || "") + " scale(" + (x === 0.5 ? 1.06 : 1) + ")"; return;
    }
    if (!spring) f = Math.max(f, 0.97);   // a small settle, no bounce
    var o = spring ? Math.min(1, x * 2.2) : x, sc = f + (1 - f) * (spring ? outBack(x) : outCubic(x));
    if (t1 !== undefined) o *= 1 - prog(t, t1, 0.35);
    n.style.opacity = o; n.style.transform = (n._base || "") + " scale(" + sc + ")";
  }
  function fade(n, t, t0, t1, dy) {
    if (MOTION === "fade") { var ff = outCubic(prog(t, t0, 0.5)); if (t1 !== undefined) ff *= 1 - outCubic(prog(t, t1, 0.35)); n.style.opacity = ff; n.style.transform = n._base || ""; return; }
    if (MOTION === "clunk") {
      var c0 = prog(t, t0, 0.5), oc = c0 > 0 ? 1 : 0; if (t1 !== undefined && t >= t1) oc = t < t1 + 0.07 ? 0.4 : 0;
      n.style.opacity = oc; n.style.transform = (n._base || "") + " translateY(" + (c0 === 0.5 ? 8 : 0) + "px)"; return;
    }
    var x = outCubic(prog(t, t0, 0.5)), o = x, move = MOTION === "spring" ? (dy === undefined ? 16 : dy) : MOTION === "snap" ? 6 : 0;
    if (t1 !== undefined) o *= 1 - prog(t, t1, 0.35);
    n.style.opacity = o; n.style.transform = (n._base || "") + " translateY(" + ((1 - x) * move) + "px)";
  }
  function el(tag, cls, text, css, parent) {
    var n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined && text !== null) n.textContent = text;
    if (css) Object.keys(css).forEach(function (key) { n.style[key] = typeof css[key] === "number" ? css[key] + "px" : css[key]; });
    (parent || F).appendChild(n); if (!css || css.opacity === undefined) n.style.opacity = 0; return n;
  }
  function mixHex(a, b, x) {
    var pa = [1, 3, 5].map(function (i) { return parseInt(a.slice(i, i + 2), 16); }), pb = [1, 3, 5].map(function (i) { return parseInt(b.slice(i, i + 2), 16); });
    return "#" + pa.map(function (v, i) { return ("0" + Math.round(v + (pb[i] - v) * x).toString(16)).slice(-2); }).join("");
  }
  function hue(h) {
    var r = parseInt(h.slice(1, 3), 16) / 255, g = parseInt(h.slice(3, 5), 16) / 255, b = parseInt(h.slice(5, 7), 16) / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    if (d < 0.06) return 400 + (1 - mx) * 100; // neutrals last, light to dark
    var x = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return (x * 60 + 360) % 360;
  }
  function appear(n, t, t0, d) {
    var x = prog(t, t0, d || 0.4);
    if (MOTION === "clunk") { n.style.opacity = x > 0 ? 1 : 0; n.style.transform = "scale(" + (x === 0.5 ? 1.08 : 1) + ")"; return; }
    n.style.opacity = outCubic(x); n.style.transform = "";
  }
  function inkOn(hex) {
    var c = [1, 3, 5].map(function (i) { var v = parseInt(hex.slice(i, i + 2), 16) / 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    var L = 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; return (L + 0.05) / 0.05 > 1.05 / (L + 0.05) ? "#1d1d1f" : "#ffffff";
  }
  function boxWord(word, hex) { return "<span class=\"hl\" style=\"--hl:" + hex + ";--hlink:" + inkOn(hex) + "\">" + word + "</span>"; }
  // The box comes on in one frame (or grows across the word for a smoother motion)
  function boxOn(sp, t, t0) { var on = MOTION === "clunk" || MOTION === "cut" ? (t >= t0 ? 1 : 0) : outCubic(k(t, t0, 0.35)); sp.style.backgroundSize = (100 * on) + "% 100%"; sp.style.color = on >= 1 ? "var(--hlink)" : ""; }
  function count(n, t, t0, d, from, to, fmt) { var x = inOut(k(t, t0, d)); n.textContent = (fmt || String)(Math.round(from + (to - from) * x)); }

  // v3's numbers: the shared sample and v3's older colors (design/v3/archive.js), numbered by when each was kept, the way v3
  // numbers them (seedSample in design/v3/index.html), so a color has the same number in the charts as in the prototype
  var V3NO = (function () {
    var all = ((window.PALIT_SAMPLE || {}).captures || []).map(function (c) { return { at: c.capturedAt, orig: c.number }; })
      .concat((((window.PALIT_V3_EARLIER || {}).captures) || []).map(function (c) { return { at: c.capturedAt, orig: null }; }));
    all.sort(function (a, b) { return new Date(a.at) - new Date(b.at); });
    var m = {}; all.forEach(function (x, i) { if (x.orig) m[x.orig] = i + 1; }); return m;
  })();
  function v3No(c) { return "No. " + ("00" + (V3NO[c.number] || c.number)).slice(-3); }

  var SCENES = {};

  /* ---------- The splash (4s, entry 203): right after “this is Palit.” The mark fills with one color after another and settles
     on the demo's red, then the name, then one line. The mark is brand.js's: the square for now, Daeun's logo once it's in. ---------- */
  SCENES.splash = { seconds: 4, build: function () {
    var B = window.PALIT_BRAND || {}, SP = ((window.PALIT_SCRIPT || {}).sections || []).filter(function (x) { return x.id === "splash"; })[0] || {};
    var line = (SP.text || [])[1] || "";
    var row = el("div", "a", null, { left: 0, top: 370, width: 1920, height: 260, display: "flex", alignItems: "center", justifyContent: "center", gap: "56px", opacity: 1 });
    var mark = el("div", null, null, { width: 172, height: 172, flex: "none", opacity: 1 }, row);   // bigger, and no caption under it (Noah, October 19)
    if (B.markUrl && B.markMode === "image") { mark.style.background = "url(\"" + B.markUrl + "\") center / contain no-repeat"; }
    else if (B.markUrl) { mark.style.webkitMask = mark.style.mask = "url(\"" + B.markUrl + "\") center / contain no-repeat"; }
    var name = el("div", null, B.name || "Palit", { fontSize: "232px", lineHeight: "1", letterSpacing: "-0.05em", fontWeight: 400, color: "#1d1d1f", opacity: 1 }, row);
    var CYCLE = [OURS.pool, OURS.mango, OURS.plum, OURS.sage, OURS.blue, OURS.clay, OURS.hyacinth];
    return function (t) {
      // The mark comes in, its color turning over a few times, then holding on the last color kept
      pop(mark, t, 0.15, 3.6, 0.7);
      var i = Math.min(CYCLE.length - 1, Math.max(0, Math.floor((t - 0.15) / 0.13)));
      if (!(B.markUrl && B.markMode === "image")) mark.style.backgroundColor = CYCLE[i];
      fade(name, t, 1.0, 3.6, 10);
    };
  } };

  /* ---------- The brief (15s): its two lines, word for word from docs/06-svsd-brief.md, then our answer. Noah's note on the
     script page (October 19): “it doesn't need to be there as long as it is currently, just enough time to quickly move on from
     it after its been established.” So the lines come in fast, hold while they're said, and clear for the answer at 7.1s. ---------- */
  SCENES.brief = { seconds: 15, build: function () {
    // Word for word, with the brief's own quote marks only (docs/06 lines 13 and 14); "The SVSD brief" above says whose words they are
    var L1 = "Pick a specific group of people and design a product they'll love, even if others might hate it.";
    var L2a = "There's just one constraint: Your product must center around the theme of “", WORD = "storytelling", L2b = ".”";
    // Centered (Noah, October 19: “I'd like them to be centered in the middle of the screen”)
    var src = el("div", "a t-xs", "The SVSD brief", { left: 0, top: 250, width: 1920, textAlign: "center" });
    var b1 = el("div", "a", null, { left: 180, top: 310, width: 1560, fontSize: "60px", lineHeight: "1.12", letterSpacing: "-0.03em", textAlign: "center", opacity: 1 });
    var b2 = el("div", "a", null, { left: 180, top: 500, width: 1560, fontSize: "60px", lineHeight: "1.12", letterSpacing: "-0.03em", textAlign: "center", opacity: 1 });
    // A word at a time, not a letter at a time (Noah, entry 198), and quickly
    function words(text, into) { var out = []; text.split(" ").forEach(function (w, i, a) { if (!w) return; var sp = document.createElement("span"); sp.textContent = w; sp.style.opacity = 0; into.appendChild(sp); if (i < a.length - 1) into.appendChild(document.createTextNode(" ")); out.push(sp); }); return out; }
    var c1 = words(L1, b1), u = document.createElement("span"), c2 = words(L2a.replace(/ “$/, ""), b2);
    var grp = document.createElement("span"); grp.style.opacity = 0;
    b2.appendChild(document.createTextNode(" ")); b2.appendChild(grp);
    grp.appendChild(document.createTextNode("“")); grp.appendChild(u); u.textContent = WORD; grp.appendChild(document.createTextNode(L2b));
    // storytelling in a box of a bright color from the archive, in place of the underline (Noah, October 19)
    u.className = "hl"; u.style.setProperty("--hl", OURS.mango); u.style.setProperty("--hlink", inkOn(OURS.mango));
    c2.push(grp);
    // Our answer, in the words of Noah's line (brief-2), once the brief has cleared
    var cards = [["Who it's for", "Visual designers in the ideation and exploratory phase"], ["The story", "Where you found each color, and the journey it took to get there"]].map(function (c, i) {
      var n = el("div", "card", null, { left: 180 + i * 800, top: 330, width: 760, height: 250 });
      el("div", "t-xs", c[0], { position: "absolute", left: 36, top: 28, opacity: 1 }, n);
      el("div", "t-m", c[1], { position: "absolute", left: 36, top: 70, width: 690, opacity: 1 }, n);
      return n;
    });
    return function (t) {
      // ?reveal=word (as built), line (each line at once) or all (everything at once), for the video workshop
      var RV = q.get("reveal") || "word", OUT = 6.5;
      fade(src, t, 0.1, OUT);
      // Each word lands in two frames, a beat apart: quick, sudden, a little clunky
      function land(sp, t0) { var x = prog(t, t0, MOTION === "clunk" ? 0.16 : 0.4), out = prog(t, OUT, 0.35); sp.style.opacity = (MOTION === "clunk" ? (x > 0 ? 1 : 0) : outCubic(x)) * (1 - outCubic(out)); sp.style.display = "inline-block"; sp.style.transform = "scale(" + (MOTION === "clunk" && x === 0.5 ? 1.1 : 1) + ")"; }
      c1.forEach(function (sp, i) { land(sp, RV === "word" ? 0.2 + i * 0.075 : 0.2); });
      c2.forEach(function (sp, i) { land(sp, RV === "word" ? 1.6 + i * 0.075 : RV === "line" ? 1.6 : 0.2); });
      boxOn(u, t, 2.9);
      cards.forEach(function (c, i) { pop(c, t, 7.2 + i * 0.6, undefined, 0.9); });
    };
  } };

  /* ---------- The problem (45s): 33 of 51, 2 of 8, more alike, Pantone and Palit ---------- */
  SCENES.problem = { seconds: 45, build: function () {
    var dots = [], i;
    var h1 = el("div", "a t-l", "33 of 51 designers save inspiration", { left: 160, top: 150 });
    var h1s = el("div", "a src", "And designers distrust sources that are poorly documented. Koch et al., DRS 2018", { left: 162, top: 240 });
    // 51 squares of colors from the archive, faint until they fill in (Noah, October 19: “boxes of random colors that are low
    // opacity and turn into high opacity as they fill in”), and a little bigger
    var ARCH = (((window.PALIT_SAMPLE || {}).captures) || []).concat((((window.PALIT_V3_EARLIER || {}).captures) || [])).map(function (c) { return c.hex; });
    for (i = 0; i < 51; i++) dots.push(el("div", "a", null, { left: 160 + (i % 17) * 94, top: 360 + Math.floor(i / 17) * 94, width: 84, height: 84, background: ARCH.length ? ARCH[(i * 37 + 11) % ARCH.length] : MIX[i % MIX.length] }));
    // research.js: 2 point to a page about the work (The Dieline on Ravex, francofrontera.com for SOUND), 1 to a Pinterest
    // repost, 3 to bare image files (Pinterest, Instagram, a portfolio host), and 2 to nothing. The swatches stand in for the images.
    var refs = [], labels = [], SRC = ["An image file, Pinterest", "No source", "The Dieline, on Ravex", "A Pinterest repost", "An image file, Instagram", "francofrontera.com, on SOUND", "No source", "An image file, a portfolio host"], KEEP = [2, 5];
    var RC = [OURS.blush, OURS.oxblood, OURS.hyacinth, OURS.pool, OURS.sage, OURS.plum, OURS.mango, OURS.gallery];
    for (i = 0; i < 8; i++) {
      var x = 160 + (i % 4) * 410, y = 110 + Math.floor(i / 4) * 310;
      refs.push(el("div", "a", null, { left: x, top: y, width: 370, height: 230, background: RC[i] }));
      labels.push(el("div", "a t-s", SRC[i], { left: x, top: y + 244, width: 370 }));
    }
    var h2 = el("div", "a t-m", "2 of 8 references on Noah's boards point to a page about the work", { left: 160, top: 760, width: 1500 });
    var pals = [];
    for (i = 0; i < 6; i++) { var row = []; for (var j = 0; j < 5; j++) row.push(el("div", "a", null, { left: 160 + j * 150, top: 150 + i * 110, width: 140, height: 96 })); pals.push(row); }
    var same = [OURS.blush, OURS.rose, OURS.clay, OURS.oxblood, OURS.graphite];
    var h3 = el("div", "a t-m", "With AI suggestions, stories got more creative, and more alike", { left: 1000, top: 360, width: 760 });
    var h3s = el("div", "a src", "Doshi & Hauser, Science Advances, 2024", { left: 1002, top: 500 });
    var p1 = el("div", "a t-l gray", "Pantone sells consistency.", { left: 160, top: 380 });
    var p2 = el("div", "a t-xl", null, { left: 160, top: 480 });
    p2.innerHTML = "Palit sells " + boxWord("ownership", OURS.hyacinth) + ".";   // a box, not an underline (Noah, October 19)
    var p2u = p2.firstElementChild;
    var p3 = el("div", "a t-s gray", "You find every color before you use it.", { left: 162, top: 660 });
    return function (t) {
      // 33 of 51
      fade(h1, t, 0.3, 11.4); fade(h1s, t, 0.8, 11.4);
      dots.forEach(function (d, i) {
        pop(d, t, 0.6 + i * 0.03, 11.4);
        var fill = i < 33 && t >= 4 + i * 0.09; if (Number(d.style.opacity) > 0) d.style.opacity = fill ? 1 : 0.16;
      });
      // 2 of 8
      refs.forEach(function (r, i) {
        pop(r, t, 12.2 + i * 0.18, 21.5);
        var dim = KEEP.indexOf(i) < 0 ? k(t, 15.5 + i * 0.15, 0.5) : 0;
        r.style.filter = "saturate(" + (1 - 0.85 * dim) + ") opacity(" + (1 - 0.55 * dim) + ")";
      });
      labels.forEach(function (l, i) {
        fade(l, t, 12.6 + i * 0.18, 21.5, 8);
        var linked = KEEP.indexOf(i) >= 0;
        l.style.color = !linked && t > 15.5 + i * 0.15 ? "#c7c7cc" : "#1d1d1f";
        l.style.textDecoration = linked && t > 15.8 ? "underline" : "none";
        l.style.textUnderlineOffset = "6px";
      });
      fade(h2, t, 17, 21.5);
      // More alike
      pals.forEach(function (row, i) { row.forEach(function (c, j) {
        pop(c, t, 22.2 + i * 0.12 + j * 0.04, 31.5);
        var start = MIX[(i * 5 + j * 3) % MIX.length], x = inOut(k(t, 25.5 + i * 0.2, 3.2));
        c.style.background = mixHex(start, same[j], x);
      }); });
      fade(h3, t, 23.5, 31.5); fade(h3s, t, 24.2, 31.5);
      // Pantone and Palit
      fade(p1, t, 32.4); fade(p2, t, 34.4);
      boxOn(p2u, t, 35.4);
      fade(p3, t, 37);
    };
  } };

  /* ---------- Who loves it, and who won't (30s) ---------- */
  SCENES.people = { seconds: 30, build: function () {
