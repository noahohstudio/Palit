<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palit video player</title>
<link rel="stylesheet" href="../system/components.css">
<style>
  /* The video, played from the script (entry 173): a 1920 by 1080 frame with the scene, a subtle speaker chip and a
     subtitle bar on top. Each section opens on its statement, a white screen with one word in color (entry 181), and a
     section with a viz plays viz.html's scene on the player's clock. ?clean hides the controls for recording; #demo
     (any section's id) or ?t=95 starts there; ?play starts playing. Everything on top is editable in the Edit panel. */
  html, body { margin: 0; height: 100%; background: #111113; color: var(--ink); font: 14px/1.4 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
  button, input, select { font: inherit; }
  .num { font-variant-numeric: tabular-nums; }
  #view { position: fixed; inset: 0 0 var(--ctl, 92px) 0; overflow: hidden; }
  body.clean #view { bottom: 0; }
  #frame { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 50% 50%; transform: translate(-50%, -50%); background: var(--bg, #ffffff); overflow: hidden; }

  /* The scene */
  #scene { position: absolute; inset: 0; }
  .desk { position: absolute; left: 96px; top: 0; width: 1440px; height: 900px; border: 0; transform-origin: 0 0; transform: scale(1.2); background: #1c1c1e; }
  /* Round two (Noah, October 20, m024: “the desktop is like a square. Can it be rounded a little, and be windowed by the white
     background slightly? Just so it looks equal when we zoom out of the window.”): at its widest the desktop is a window on the
     white page, rounded, 44px clear above and below; zoomed in, it fills the frame */
  .desk.win { border-radius: 16px; box-shadow: 0 0 0 1px rgba(29, 29, 31, 0.08), 0 24px 64px rgba(29, 29, 31, 0.16); }
  .stand { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 180px 120px; }
  .stand .kind { position: absolute; right: 64px; top: 48px; font-size: 20px; color: #9c9ca1; }
  .stand h2 { font-size: 96px; line-height: 1; letter-spacing: -0.04em; font-weight: 400; max-width: 1400px; }
  .stand p.on { margin: 28px 0 0; font-size: 26px; line-height: 1.4; color: #6b6b70; max-width: 1300px; }
  .stand ul { list-style: none; margin: 44px 0 0; padding: 0; }
  .stand li { font-size: 40px; line-height: 1.25; letter-spacing: -0.015em; padding: 12px 0; border-top: 1px solid #e6e6e8; opacity: 0; transform: translateY(8px); transition: opacity 240ms cubic-bezier(.2, .8, .2, 1), transform 240ms cubic-bezier(.2, .8, .2, 1); max-width: 1500px; }
  .stand li.in { opacity: 1; transform: none; }
  .stand.filmed { background: #1d1d1f; color: #fff; }
  .stand.filmed p.on { color: #a1a1a6; }
  .stand p.on.hint { position: absolute; left: 160px; top: 96px; margin: 0; font-size: 22px; }
  .stand.filmed li { border-top-color: #3a3a3e; }

  /* A visualization (viz.html), full frame, driven by the player's clock */
  .vizf { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; background: #fff; }
  .vizf.insert { z-index: 5; opacity: 0; }

  /* The keys being pressed on the animated desktop, at the bottom of the picture (Noah, October 19, entry 215) */
  #keys { position: absolute; left: 50%; bottom: 128px; z-index: 23; display: flex; gap: 10px; transform: translateX(-50%); pointer-events: none; }
  #keys kbd { min-width: 30px; padding: 10px 20px; border-radius: 12px; background: rgba(29, 29, 31, 0.9); color: #fff; font: 400 28px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; text-align: center; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25); }

  /* Headers over a filmed shot, one after another, white on the film, in the statement's type (the walk-in, entry 213) */
  #heads { position: absolute; inset: 0; z-index: 25; pointer-events: none; }
  /* Our names as we say them, on the intro (October 21): bottom left and right, each in its speaker's color, big enough to
     read and quiet enough to stay under the shot; each rises from behind its own baseline, the kit's one entrance */
  #names { position: absolute; inset: 0; z-index: 24; pointer-events: none; }
  #names .nm { position: absolute; bottom: 128px; overflow: hidden; padding: 0.06em 0.08em 0.18em; margin: 0 -0.08em -0.18em; font-size: 60px; line-height: 1; letter-spacing: -0.02em; white-space: nowrap; }
  #names .nm.left { left: 84px; }
  #names .nm.right { right: 84px; text-align: right; }
  #names .nm span { display: block; opacity: 0; text-shadow: 0 2px 22px rgba(0, 0, 0, 0.35), 0 1px 3px rgba(0, 0, 0, 0.25); will-change: transform, opacity; }
  #heads p { position: absolute; left: 160px; right: 160px; top: 50%; margin: 0; transform: translateY(-50%); font-size: 128px; line-height: 1.04; letter-spacing: -0.045em; font-weight: 400; color: #fff; opacity: 0; }
  /* The walk-in titles (m001, entry 225): the same type and spacing, huge, each in its person's color, cut on with the beat and
     no fade. Positions are set per title in renderTitles. */
  #heads.titles p { left: 84px; right: auto; top: 0; transform: none; white-space: nowrap; letter-spacing: -0.045em; transform-origin: 0 50%; will-change: transform; }

  /* The rough cut's footage (entry 225): the shot plays full frame in time with the player's clock, over the stand-in, which
     shows only if the footage can't load (the public site doesn't carry it) */
  .film { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; background: #000; }
  #tails { display: none; }
  /* Above the desk, when the camera goes higher than the menu bar (the opening shot, close on the icon): the desk's own top row
     of pixels, stretched up, so the menu bar's color runs on past the top of the screen with nothing in it (entry 230) */
  .deskmirror { position: absolute; left: 96px; top: 0; width: 1440px; height: 901px; transform-origin: 0 0; pointer-events: none; display: none; overflow: hidden; z-index: 1; }
  .deskmirror.on { display: block; }
  .deskmirror i { position: absolute; left: 0; right: 0; bottom: 0; height: 1px; background-size: 1440px 900px; background-position: 0 0; background-repeat: no-repeat; transform-origin: 50% 100%; transform: scaleY(900); }

  /* The keys, as keycaps (entry 230; Noah, October 20: “the keybinds showing could be prettier. Like they appear in the order you
     click them in, and show for just a little longer”): each key comes up the moment it's pressed, beside the ones before it */
  #keys.caps { gap: 14px; bottom: 140px; align-items: flex-end; transition: opacity 220ms cubic-bezier(.2, .8, .2, 1); }
  #keys.caps.out { opacity: 0; }
  #keys.caps kbd, .keysout kbd { box-sizing: border-box; min-width: 76px; height: 76px; padding: 0 22px; display: grid; place-items: center; border-radius: 14px; background: #fff; color: #1d1d1f; font: 400 34px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; letter-spacing: -0.01em; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08), 0 5px 0 -1px #d5d5da, 0 6px 0 -1px rgba(0, 0, 0, 0.1), 0 18px 34px rgba(0, 0, 0, 0.22); animation: capIn 460ms cubic-bezier(.22, 1, .36, 1) both; transition: opacity 300ms cubic-bezier(.4, 0, .2, 1), transform 300ms cubic-bezier(.4, 0, .2, 1); }
  /* Out in the order they were pressed (Noah, round two, m023: “the keybinds could fade out a little smoother, in the order you
     click them in. They should bump slightly also in the order you use them in, not too harshly though”) */
  #keys.caps kbd.word, .keysout kbd.word { font-size: 28px; }
  /* The keys that were up, when new ones replace them: they leave from where they were, one after another (round three, m027) */
  .keysout { position: absolute; z-index: 23; display: flex; gap: 14px; align-items: flex-end; pointer-events: none; }
  .keysout kbd.held { animation: none; }
  @keyframes capIn { 0% { opacity: 0; transform: translateY(16px) scale(0.94); } 55% { opacity: 1; transform: translateY(-2px) scale(1.03); } 80% { transform: translateY(1px) scale(0.995); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08), 0 3px 0 -1px #d5d5da, 0 4px 0 -1px rgba(0, 0, 0, 0.1), 0 12px 24px rgba(0, 0, 0, 0.2); } 100% { opacity: 1; transform: none; } }

  /* The statement: a white screen, our header type, one word in one of our colors (Noah, October 19) */
  #stmt { position: absolute; inset: 0; z-index: 30; background: #fff; display: none; }
  #stmt.in { display: block; }
  #stmt p { position: absolute; left: 160px; right: 160px; top: 50%; margin: 0; transform: translateY(-50%); font-size: 128px; line-height: 1.04; letter-spacing: -0.045em; font-weight: 400; color: #1d1d1f; text-align: center; }
  /* The word in color is a box of its color now, not colored type (Noah, October 19, entry 215) */
  #stmt span.hit { padding: 0 0.12em; margin: 0 -0.02em; }
  #stmt span { display: inline-block; white-space: pre; will-change: transform, opacity; }
  /* The statement, in the motion kit (entry 225; Noah, October 20: “something with slightly more movement and speed may be the
     move. Keep this in mind for all future overlays”): each word rises from behind its own baseline, fast, one after another;
     then the color lands on the one word, a square of it dropping in the way a kept color lands in the palette, and spreading
     into the box. .w holds a word, .m is its mask, .sw the color. */
  #stmt.kit p { text-align: center; font-size: 156px; line-height: 1.02; text-wrap: balance; }
  #stmt.kit span.w { position: relative; display: inline-block; vertical-align: top; isolation: isolate; }
  #stmt.kit span.m { display: inline-block; overflow: hidden; padding: 0.02em 0.02em 0.1em; margin: -0.02em -0.02em -0.1em; vertical-align: top; }
  #stmt.kit span.wi { display: inline-block; will-change: transform; }
  #stmt.kit span.w.hit span.m { padding-left: 0.12em; padding-right: 0.12em; margin-left: -0.02em; margin-right: -0.02em; }
  #stmt.kit i.sw { position: absolute; z-index: -1; left: 0; top: 0; width: 0; height: 0; background: var(--hc); will-change: width, opacity; }
  /* Round two (Noah, October 20, m009: “lets instead of the droplet, adopt the cursor quickly dragging a box around the highlighted
     word - feels more on-theme and professional. can we have a subtle fade with the slide up? Both in and out”): the word's ink
     copy shows only where the selection has passed, so the word turns as it's dragged over */
  #stmt.kit span.m { position: relative; }
  #stmt.kit span.wi2 { position: absolute; left: 0; top: 0; white-space: pre; pointer-events: none; will-change: transform, clip-path; }
  #stmt.kit .scur { position: absolute; left: 0; top: 0; width: 44px; height: 60px; z-index: 3; pointer-events: none; opacity: 0; will-change: transform, opacity; }
  #stmt.kit span.sp { display: inline-block; white-space: pre; }
  /* A deep dive's caption, just above the statement's text, on its left edge (Noah, October 19: “Deep dive number one”) */
  #stmt small { position: absolute; left: 0; right: 0; bottom: 100%; margin-bottom: 26px; font-size: 35px; line-height: 1.2; letter-spacing: -0.01em; color: #6b6b70; white-space: nowrap; text-align: center; will-change: transform, opacity; }

  /* The mark: the square for now, or the new logo, filled with a color (brand.js, entry 173) */
  .mk { display: inline-block; flex: none; background: var(--mc, #d14808); }
  .mk.shaped { -webkit-mask: var(--mark-url) center / contain no-repeat; mask: var(--mark-url) center / contain no-repeat; }
  .mk.image { background: var(--mark-url) center / contain no-repeat; }

  /* The section card: a placeholder for Noah's overlays */
  #card { position: absolute; left: 136px; top: 64px; z-index: 20; display: flex; align-items: center; gap: 18px; padding: 16px 26px 16px 18px; background: rgba(255, 255, 255, 0.94); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(0, 0, 0, 0.06); opacity: 0; transform: translateY(-6px); transition: opacity 300ms cubic-bezier(.2, .8, .2, 1), transform 300ms cubic-bezier(.2, .8, .2, 1); pointer-events: none; }
  #card.in { opacity: 1; transform: none; }
  #card .mk { width: 34px; height: 34px; }
  #card .over { font-size: 18px; color: #6b6b70; }
  #card .ttl { font-size: 34px; line-height: 1.1; letter-spacing: -0.02em; }

  /* The speaker chip: subtle, only the square and the name */
  #chip { position: absolute; left: 136px; bottom: 132px; z-index: 21; display: flex; align-items: center; gap: 12px; font-size: 24px; color: #1d1d1f; text-shadow: 0 0 14px rgba(255, 255, 255, 0.95), 0 0 3px rgba(255, 255, 255, 0.9); opacity: 0; transition: opacity 240ms cubic-bezier(.2, .8, .2, 1); pointer-events: none; }
  #chip.in { opacity: 1; }
  #chip i { width: 14px; height: 14px; background: var(--sc); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.7); }
  #chip.dark { color: #fff; text-shadow: 0 0 10px rgba(0, 0, 0, 0.6); }

  /* The subtitle bar, at the very bottom, until the voiceover is in */
  #subs { position: absolute; left: 0; right: 0; bottom: 0; z-index: 22; min-height: 104px; display: grid; place-items: center; padding: 18px 200px 22px; box-sizing: border-box; background: rgba(255, 255, 255, 0.95); border-top: 1px solid rgba(0, 0, 0, 0.08); font-size: 34px; line-height: 1.3; letter-spacing: -0.01em; text-align: center; text-wrap: balance; color: #1d1d1f; transition: opacity 200ms; }
  #subs.dark { background: rgba(17, 17, 19, 0.88); border-top: 0; color: #fff; }
  #subs.off, #subs.quiet { opacity: 0; }
  /* The voiceover guide (?prompter, October 21): the picture with the line being said, who says it and the file to save it as,
     the next one counting down, and the film's time, for recording the voiceover over the screens */
  /* The voiceover guide (?prompter, October 21): the picture on top, as it plays, and the lines under it, silent */
  body.prompting { background: #fff; }
  body.prompting #frame { overflow: visible; clip-path: inset(0 0 calc(-1 * var(--pp)) 0); }
  #prompter { position: absolute; left: 0; right: 0; top: 1080px; height: var(--pp); box-sizing: border-box; z-index: 27; background: #fff; border-top: 1px solid rgba(0, 0, 0, 0.12); padding: 26px 64px 22px; display: grid; gap: 14px; align-content: start; color: #1d1d1f; }
  #prompter .meter { position: absolute; left: 0; top: -1px; height: 8px; width: 0; }
  #prompter .row { display: grid; grid-template-columns: 200px minmax(0, 1fr) 210px; gap: 24px; align-items: baseline; }
  #prompter .now { font-size: 40px; line-height: 1.22; letter-spacing: -0.01em; }
  #prompter .next { font-size: 25px; line-height: 1.3; color: #6e6e73; }
  #prompter .next .txt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #prompter .who { display: flex; align-items: center; gap: 12px; font-size: 28px; white-space: nowrap; }
  #prompter .next .who { font-size: 22px; }
  #prompter .who i { width: 18px; height: 18px; flex: none; }
  #prompter .who b { font-weight: 500; }
  #prompter .id { font-size: 22px; color: #6e6e73; text-align: right; white-space: nowrap; }
  #prompter .now.waiting .txt { color: #8e8e93; }
  #prompter .now.soon .txt { color: #1d1d1f; }
  #prompter .filmed .txt { color: #8e8e93; }
  #tc { position: absolute; top: 22px; right: 28px; z-index: 31; padding: 4px 10px; background: rgba(17, 17, 19, 0.6); color: #fff; font-size: 22px; letter-spacing: 0.02em; }
  #subs .who { color: var(--sc); }

  /* The controls under the frame */
  #controls { position: fixed; left: 0; right: 0; bottom: 0; min-height: 92px; box-sizing: border-box; padding: 10px 18px; background: #1c1c1e; color: #e5e5ea; display: flex; flex-direction: column; justify-content: center; gap: 8px; font-size: 13px; }
  body.clean #controls { display: none; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .cbtn { border: 0; background: #2c2c2e; color: #e5e5ea; padding: 4px 11px; border-radius: 6px; cursor: pointer; }
  .cbtn:hover { background: #3a3a3c; }
  a.cbtn { text-decoration: none; font: 13.333px system-ui, -apple-system, sans-serif; }
  .cbtn[aria-pressed="true"] { background: #e5e5ea; color: #1c1c1e; }
  #scrub { flex: 1; min-width: 200px; accent-color: #e5e5ea; }
  #time { min-width: 92px; color: #a1a1a6; }
  #secs { display: flex; flex-wrap: wrap; gap: 4px; }
  #secs button { border: 0; background: none; color: #8e8e93; padding: 2px 6px; border-radius: 5px; cursor: pointer; font-size: 12px; }
  #secs button:hover { color: #e5e5ea; }
  #secs button.on { background: #3a3a3c; color: #fff; }
  .grow { flex: 1; }
  .hint { color: #8e8e93; }

  /* The edit panel */
  #edit { position: fixed; top: 0; right: 0; bottom: var(--ctl, 92px); width: 340px; z-index: 50; overflow-y: auto; background: #f5f5f7; color: #1d1d1f; box-shadow: -10px 0 30px rgba(0, 0, 0, 0.3); padding: 18px 20px 24px; box-sizing: border-box; font-size: 13px; }
  #edit[hidden] { display: none; }
  #edit h2 { font-size: 20px; font-weight: 400; letter-spacing: -0.01em; margin: 0 0 4px; }
  #edit h3 { font-size: 12px; font-weight: 400; color: #6b6b70; margin: 18px 0 6px; }
  #edit label { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  #edit input[type="text"] { flex: 1; min-width: 0; padding: 4px 8px; border: 1px solid #d1d1d6; background: #fff; }
  #edit input[type="color"] { width: 34px; height: 24px; padding: 0; border: 1px solid #d1d1d6; background: #fff; }
  #edit .pbtn { border: 1px solid #d1d1d6; background: #fff; padding: 4px 10px; cursor: pointer; }
  #edit .pbtn:hover { border-color: #1d1d1f; }
  #edit p { margin: 6px 0; color: #6b6b70; }
  #edit .prev { display: flex; align-items: center; gap: 12px; margin: 8px 0; }
  #edit .prev .mk { width: 40px; height: 40px; }
</style>
</head>
<body>
<div id="view"><div id="frame" aria-label="The video frame">
  <div id="scene"></div>
  <div id="tails" aria-hidden="true"></div>
  <div id="heads" aria-live="polite"></div>
  <div id="names" aria-hidden="true"></div>
  <div id="keys" aria-hidden="true"></div>
  <div id="stmt" aria-live="polite"><p></p></div>
  <div id="card" aria-hidden="true"><span class="mk" id="card-mk"></span><div><div class="over" id="card-over"></div><div class="ttl" id="card-ttl"></div></div></div>
  <div id="chip" aria-hidden="true"><i></i><span></span></div>
  <div id="subs" class="quiet" aria-live="polite"></div>
  <div id="prompter" hidden><div class="meter"></div><div class="row now"><span class="who"><i></i><b></b></span><span class="txt"></span><span class="id num"></span></div><div class="row next"><span class="who"><i></i><b></b></span><span class="txt"></span><span class="id num"></span></div></div>
  <div id="tc" class="num" hidden></div>
</div></div>

<div id="controls" aria-label="Player">
  <div class="row">
    <button type="button" class="cbtn" id="play">Play</button>
    <span id="time" class="num">0:00 / 7:00</span>
    <input type="range" id="scrub" min="0" max="420" step="0.1" value="0" aria-label="Time">
    <button type="button" class="cbtn" id="t-subs" aria-pressed="true" title="S">Subtitles</button>
    <button type="button" class="cbtn" id="t-chips" aria-pressed="true" title="C" hidden>Speakers</button>
    <button type="button" class="cbtn" id="t-cards" aria-pressed="true" title="T">Section cards</button>
    <button type="button" class="cbtn" id="t-music" aria-pressed="true" title="M">Music</button>
    <button type="button" class="cbtn" id="t-edit" aria-pressed="false" title="E">Edit</button>
  </div>
  <div class="row"><div id="secs"></div><span class="grow"></span><span class="hint">Space plays, ← and → move 5 seconds, M mutes the music, ?clean hides this bar for recording</span></div>
</div>

<aside id="edit" hidden aria-label="Edit the overlays">
  <h2>Edit the overlays</h2>
  <p>Kept in this browser. Claude copies what you settle on into design/brand/brand.js, so v3 and the video share it.</p>
  <h3>The logo</h3>
  <div class="prev"><span class="mk" id="ed-mk"></span><span id="ed-mk-label"></span></div>
  <label><input type="file" id="ed-logo" accept=".svg,image/svg+xml,image/png"></label>
  <label><input type="radio" name="mode" value="fill" id="ed-fill"> A shape, filled with the last color</label>
  <label><input type="radio" name="mode" value="image" id="ed-image"> As it is, in its own colors</label>
  <button type="button" class="pbtn" id="ed-square">Use the square again</button>
  <h3>Speakers</h3>
  <label><input type="color" id="ed-c-Noah"><input type="text" id="ed-n-Noah" aria-label="Noah's name on the chip"></label>
  <label><input type="color" id="ed-c-Daeun"><input type="text" id="ed-n-Daeun" aria-label="Daeun's name on the chip"></label>
  <label><input type="checkbox" id="ed-chipdark"> Light text, for dark scenes</label>
  <h3>Subtitles</h3>
  <label><input type="radio" name="subs" value="paper" id="ed-paper"> On paper</label>
  <label><input type="radio" name="subs" value="dark" id="ed-dark"> On dark</label>
  <h3>Music</h3>
  <p id="ed-music-what"></p>
  <label><input type="checkbox" id="ed-music"> Under the exciting moments</label>
  <label>Level <input type="range" id="ed-music-level" min="0" max="100" step="1" aria-label="Music level"></label>
  <label>Under a voice <input type="range" id="ed-music-duck" min="0" max="100" step="1" aria-label="How much of the music stays under a voice"></label>
  <h3>Calm track</h3>
  <p id="ed-calm-what"></p>
  <label>Level <input type="range" id="ed-calm-level" min="0" max="100" step="1" aria-label="Calm track level"></label>
  <label>Under a voice <input type="range" id="ed-calm-duck" min="0" max="100" step="1" aria-label="How much of the calm track stays under a voice"></label>
  <h3>The frame</h3>
  <label><input type="color" id="ed-bg"> Around the desktop</label>
  <p><button type="button" class="pbtn" id="ed-reset">Reset all of this</button></p>
</aside>

<audio id="music" preload="auto"></audio>
<audio id="calm" preload="auto"></audio>
<audio id="audition" preload="auto"></audio>
<audio id="lift" preload="auto"></audio>
<audio id="after" preload="auto"></audio>
<script src="../brand/brand.js"></script>
<script src="script.js"></script>
<script src="sound.js"></script>
<script>
(function () {
  "use strict";
  function $(id) { return document.getElementById(id); }

    bPrev.type = bNext.type = "button"; bPrev.className = bNext.className = aScript.className = "cbtn";
    bPrev.textContent = WHO ? WHO + "'s line before" : "Line before"; bNext.textContent = WHO ? WHO + "'s next line" : "Next line";
    aScript.textContent = WHO ? WHO + "'s script" : "The script"; aScript.href = "voiceover.html" + (WHO ? "?who=" + encodeURIComponent(WHO) : ""); aScript.target = "_blank"; aScript.rel = "noopener";
    bPrev.addEventListener("click", function () { jumpLine(-1); }); bNext.addEventListener("click", function () { jumpLine(1); });
    $("scrub").after(bPrev, bNext, aScript);
    document.querySelector("#controls .hint").textContent = "Space plays, ← and → move 5 seconds, ↑ and ↓ go to " + (WHO ? WHO + "'s" : "the") + " line before or after. No sound plays.";
  }
  addEventListener("keydown", function (e) {
    if (e.target.closest && e.target.closest("input, textarea, select")) return;
    if (PROMPTER && (e.key === "ArrowUp" || e.key === "ArrowDown")) { e.preventDefault(); jumpLine(e.key === "ArrowDown" ? 1 : -1); return; }
    if (e.key === " ") { e.preventDefault(); setPlaying(!playing); }
    else if (e.key === "ArrowRight") seek(T + 5);
    else if (e.key === "ArrowLeft") { cur = null; seek(T - 5); }
    else if (e.key === "s" || e.key === "S") $("t-subs").click();
    else if (e.key === "c" || e.key === "C") $("t-chips").click();
    else if (e.key === "t" || e.key === "T") $("t-cards").click();
    else if (e.key === "m" || e.key === "M") $("t-music").click();
    else if (e.key === "e" || e.key === "E") $("t-edit").click();
  });

  /* ---------- The edit panel ---------- */
  function paintEdit() {
    paintMark($("ed-mk"), "#d14808");
    $("ed-mk-label").textContent = kit.logo ? "Your logo, from this browser" : B.markUrl ? "The logo in brand.js" : "The square, until the new logo is in";
    $("ed-fill").checked = kit.mode !== "image"; $("ed-image").checked = kit.mode === "image";
    ["Noah", "Daeun"].forEach(function (w) { $("ed-c-" + w).value = speakerColor(w); $("ed-n-" + w).value = speakerName(w); });
    $("ed-chipdark").checked = !!kit.chipDark;
    $("ed-paper").checked = kit.subs !== "dark"; $("ed-dark").checked = kit.subs === "dark";
    $("ed-bg").value = kit.bg;
    $("ed-music").checked = !!kit.musicOn;
    $("ed-music-level").value = String(Math.round(musicLevel() * 100));
    $("ed-music-duck").value = String(Math.round(musicDuck() * 100));
    $("ed-music-what").textContent = MU ? "“" + MU.title + "” by " + MU.by + ". " + MU.license + ". The moments are switched on the script page." : "No music in the script.";
    var C = S.calm;
    $("ed-calm-what").textContent = !C ? "No calm track in the script." : C.src ? "“" + C.title + "” by " + C.by + ". " + C.license + "." : "Not picked yet. Claude's draft pick: " + C.pick + ". Save it as design/video/audio/calm.mp3 and Claude wires it in.";
    $("ed-calm-level").value = String(Math.round(levelOf(CALM) * 100));
    $("ed-calm-duck").value = String(Math.round(duckOf(CALM) * 100));
  }
  $("ed-logo").addEventListener("change", function () {
    var f = $("ed-logo").files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () { kit.logo = r.result; saveKit(); paintEdit(); render(T); };
    r.readAsDataURL(f);
  });
  $("ed-fill").addEventListener("change", function () { kit.mode = "fill"; saveKit(); paintEdit(); render(T); });
  $("ed-image").addEventListener("change", function () { kit.mode = "image"; saveKit(); paintEdit(); render(T); });
  $("ed-square").addEventListener("click", function () { kit.logo = null; saveKit(); paintEdit(); render(T); });
  ["Noah", "Daeun"].forEach(function (w) {
    $("ed-c-" + w).addEventListener("input", function () { kit.colors[w] = $("ed-c-" + w).value; saveKit(); render(T); });
    $("ed-n-" + w).addEventListener("input", function () { kit.names[w] = $("ed-n-" + w).value; saveKit(); render(T); });
  });
  $("ed-chipdark").addEventListener("change", function () { kit.chipDark = $("ed-chipdark").checked; saveKit(); cur = null; render(T); });
  $("ed-paper").addEventListener("change", function () { kit.subs = "paper"; saveKit(); render(T); });
  $("ed-dark").addEventListener("change", function () { kit.subs = "dark"; saveKit(); render(T); });
  $("ed-bg").addEventListener("input", function () { kit.bg = $("ed-bg").value; saveKit(); render(T); });
  $("ed-music").addEventListener("change", function () { kit.musicOn = $("ed-music").checked; saveKit(); $("t-music").setAttribute("aria-pressed", String(kit.musicOn)); render(T); });
  $("ed-music-level").addEventListener("input", function () { kit.musicLevel = Number($("ed-music-level").value) / 100; saveKit(); render(T); });
  $("ed-music-duck").addEventListener("input", function () { kit.musicDuck = Number($("ed-music-duck").value) / 100; saveKit(); render(T); });
  $("ed-calm-level").addEventListener("input", function () { if (kit.calmFor !== S.calm.src) kit.calmDuck = null; kit.calmFor = S.calm.src; kit.calmLevel = Number($("ed-calm-level").value) / 100; saveKit(); render(T); });
  $("ed-calm-duck").addEventListener("input", function () { if (kit.calmFor !== S.calm.src) kit.calmLevel = null; kit.calmFor = S.calm.src; kit.calmDuck = Number($("ed-calm-duck").value) / 100; saveKit(); render(T); });
  $("ed-reset").addEventListener("click", function () { localStorage.removeItem(KIT); location.reload(); });

  /* ---------- Fit the frame, and start ---------- */
  // The controls take as many rows as they need, so the picture sits above however tall they are (entry 202)
  function fit() {
    var c = $("controls"), h = document.body.classList.contains("clean") ? 0 : Math.ceil(c.getBoundingClientRect().height);
    document.documentElement.style.setProperty("--ctl", h + "px");
    var P = PROMPTER ? PP : 0, v = $("view").getBoundingClientRect(), k = Math.min(v.width / W, v.height / (H + P));
    $("frame").style.transform = "translate(-50%, calc(-50% - " + (P * k / 2) + "px)) scale(" + k + ")";
  }
  addEventListener("resize", fit); fit();
  if (window.ResizeObserver) new ResizeObserver(fit).observe($("controls"));
  paintEdit();
  var startAt = Number(q.get("t")) || 0, hash = location.hash.slice(1);
  if (hash) { var hx = S.sections.filter(function (x) { return x.id === hash; })[0]; if (hx) startAt = openAt(hx); }
  seek(startAt);
  if (q.has("play")) setPlaying(true);
  // For the frame-by-frame recorder: true once everything on screen has loaded and every video is on its frame
  function ready() {
    var ok = true, sc = $("scene");
    sc.querySelectorAll(".film").forEach(function (v) { if (!v.src || v.readyState < 2 || v.seeking) ok = false; });
    sc.querySelectorAll("iframe").forEach(function (f) {
      try {
        var d = f.contentDocument, w = f.contentWindow;
        if (!d || d.readyState !== "complete" || !(f.classList.contains("desk") ? w.PalitV3 : w.PalitViz)) { ok = false; return; }
        // images still on their way (a lazy one off screen, or one with no source, never arrives, so it doesn't count)
        Array.prototype.forEach.call(d.images, function (im) { if (!im.complete && im.getAttribute("src") && im.loading !== "lazy") ok = false; });
      } catch (e) { ok = false; }
    });
    return ok;
  }
  window.PalitPlayer = { seek: seek, play: function () { setPlaying(true); }, pause: function () { setPlaying(false); }, time: function () { return T; }, ready: ready, cues: cues, kit: kit, music:{ windows: WINDOWS, volume: musicVolume, el: music, calm: { windows: CALM.windows, volume: function (t) { return layerVolume(CALM, t); }, el: CALM.el }, lift: { windows: LIFT.windows, volume: function (t) { return layerVolume(LIFT, t); } }, after: { windows: AFTER.windows, volume: function (t) { return layerVolume(AFTER, t); } } }, sfx: function () { return SFXLOG.slice(); }, voices: function () { return voices.map(function (v) { return { id: v.k.id, start: v.k.start, len: v.len, el: v.el }; }); } };
})();
