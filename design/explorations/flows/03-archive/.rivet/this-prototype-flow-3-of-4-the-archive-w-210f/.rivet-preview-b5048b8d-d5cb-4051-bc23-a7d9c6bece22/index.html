 if(!l.length){el.innerHTML=`<div class="empty">Nothing in the archive matches that yet.<br><button class="btn" id="clr">Clear</button></div>`;$('clr').onclick=clear;return}
 if(S.view==='timeline'){const g=[];l.forEach(c=>{const k=key(c);(g.length&&g[g.length-1].k===k)?g[g.length-1].c.push(c):g.push({k,c:[c]})});
  el.innerHTML=g.map(d=>{const src=[...new Set(d.c.map(c=>c.src))];return`<section class="day"><h3>${dayName(d.c[0])}</h3><p>${d.c.length} color${d.c.length>1?'s':''} from ${join(src)}</p><div class="grid">${d.c.map(c=>`<button class="tile${S.sel===c.n?' sel':''}" data-n="${c.n}" aria-label="${c.no}, ${c.name}, ${c.hex}"><div class="sw" style="background:${c.hex}"></div><b>${c.no}</b><span>${nm(c)}</span></button>`).join('')}</div></section>`}).join('')}
 else{let rows='';for(let i=0;i<l.length;i+=7)rows+=`<div class="shelf">${l.slice(i,i+7).map(c=>`<button class="chip${S.sel===c.n?' sel':''}" data-n="${c.n}" aria-label="${c.no}, ${c.name}, ${c.hex}"><i style="background:${c.hex}"></i><b>${String(c.n).padStart(3,'0')}</b><span>${c.name==='Unnamed'?c.hex:c.name}</span></button>`).join('')}</div>`;
  el.innerHTML=`<div class="wall">${rows}</div><div class="legend"><span>Red</span><span>Yellow</span><span>Green</span><span>Blue</span><span>Violet</span><span>Neutrals</span></div>`}
 el.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>select(+b.dataset.n))}
function insp(){const c=C[S.sel-1];if(!c){$('insp').innerHTML='<p class="none">Select a color to see where it came from.</p>';return}
 const k=kin(c),o=c.o;
 $('insp').innerHTML=`<div class="isw" style="background:${c.hex}"></div><p class="no">${c.no}</p><h2>${nm(c)}</h2>
 <dl><dt>Hex</dt><dd>${c.hex}</dd><dt>OKLCH</dt><dd>${o.L.toFixed(2)} ${o.C.toFixed(3)} ${Math.round(o.H)}°</dd><dt>Source</dt><dd>${c.src} · ${c.where}</dd><dt>Kept</dt><dd>${longDate(c)}, ${c.time}</dd>${c.proj?`<dt>Project</dt><dd>${PROJ[c.proj]}</dd>`:''}</dl>
 <h6>Reads as</h6><p class="reads">${reads(o)}</p><h6>Surroundings</h6>${n3(c)}
 <h6>You’ve kept this before</h6><div class="kb">${k.length?k.map(({x,e})=>`<button data-n="${x.n}"><i style="background:${x.hex}"></i>${x.no} ${nm(x)}<em>${e<2?'Nearly identical':e<5?'Close':'ΔE '+e.toFixed(1)}</em></button>`).join(''):'<p>Nothing close yet.</p>'}</div>
 <button class="btn pri" id="ofc">Open full card</button>`;
 $('insp').querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>select(+b.dataset.n));$('ofc').onclick=card}
function select(n){S.sel=n;step(5);main();insp();const t=$('scroll').querySelector(`[data-n="${n}"]`);t&&t.scrollIntoView({block:'nearest',behavior:'smooth'})}
function card(){const c=C[S.sel-1];if(!c)return;const o=c.o,dark=o.L<.6;step(6);
 $('ov').hidden=false;$('ov').innerHTML=`<div class="card" role="dialog" aria-label="${c.no} full card"><div class="bleed" style="background:${c.hex};color:${dark?'rgba(255,255,255,.8)':'rgba(0,0,0,.6)'}"><span>${c.hex}</span></div>
 <div class="cb"><div class="cmeta"><span>Palette archive</span><span>${c.no}</span></div>
 <h2 class="cname">${c.name==='Unnamed'?c.no+'<small>Unnamed</small>':c.name}</h2><div class="rule"></div>
 <div class="cg"><dl><dt>Hex</dt><dd>${c.hex}</dd><dt>OKLCH</dt><dd>${o.L.toFixed(2)} ${o.C.toFixed(3)} ${Math.round(o.H)}°</dd><dt>Locality</dt><dd>${c.src} · ${c.where}</dd><dt>Kept</dt><dd>${longDate(c)}, ${c.time}</dd><dt>Reads as</dt><dd>${reads(o)}</dd></dl>
 <div>${n3(c)}<small>Surroundings</small><div class="crop" style="background:linear-gradient(100deg,${nb(c.hex,0)},${c.hex} 45%,${nb(c.hex,8)})"></div><small>Crop</small></div></div></div>
 <div class="fine"><span>${kin(c).length?'You’ve kept this before':'First of its kind here'}</span><span>Stored on this Mac</span></div></div>
 <button class="btn close" id="cc">Close</button>`;$('cc').onclick=closeCard;$('ov').onclick=e=>{if(e.target.id==='ov')closeCard()}}
function closeCard(){$('ov').hidden=true}
function clear(){S.q='';$('q').value='';S.f='all';side();main()}
$('iris').onclick=()=>{const p=$('pop');p.hidden=!p.hidden;$('iris').classList.toggle('on',!p.hidden);if(!p.hidden)$('openA').focus()};
$('rec').innerHTML=C.slice(-5).reverse().map(c=>`<i style="background:${c.hex}" title="${c.no}"></i>`).join('');
$('openA').onclick=()=>{$('pop').hidden=true;$('iris').classList.remove('on');$('win').hidden=false;step(0);side();main();insp()};
$('x').onclick=()=>{$('win').hidden=true};
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));if(S.view==='spectrum')step(2);main()});
$('side').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;S.f=b.dataset.f;step(3);side();main()};
$('q').oninput=e=>{S.q=e.target.value;if(S.q)step(4);main()};
$('scroll').onscroll=e=>{if(e.target.scrollTop>40&&S.view==='timeline')step(1)};
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(!$('ov').hidden)return closeCard();if(!$('pop').hidden){$('pop').hidden=true;$('iris').classList.remove('on')}return}
 if($('win').hidden)return;
 if((e.metaKey&&e.key==='f')||(e.key==='/'&&document.activeElement!==$('q'))){e.preventDefault();$('q').focus();return}
 if(document.activeElement===$('q')&&e.key!=='Enter')return;
 const l=list(),i=l.findIndex(c=>c.n===S.sel);
 if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'].includes(e.key)&&l.length){e.preventDefault();const d=/Right|Down/.test(e.key)?1:-1;select(l[Math.max(0,Math.min(l.length-1,i<0?0:i+d))].n)}
 if(e.key==='Enter'&&S.sel&&$('ov').hidden){e.preventDefault();card()}});
step(-1);
</script>
</body></html>
