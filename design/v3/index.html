<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palit prototype v3</title>
<link rel="stylesheet" href="../system/components.css">
<style>
  /* Prototype v2 (entries 94–106): real pages on a real Mac wallpaper, in the look Noah picked in the
     look and flow workshop. Clean, functional and considered (A65); nothing on screen competes with the color. */
  html, body { margin: 0; height: 100%; background: #1c1c1e; color: var(--ink); font: 13px/1.4 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font: inherit; color: inherit; }
  p { margin: 0; }
  .num { font-variant-numeric: tabular-nums; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  #viewport { position: fixed; inset: 0 0 var(--ctl, 76px) 0; overflow: hidden; }
  body.clean #viewport { bottom: 0; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1440px; height: 900px; transform-origin: 50% 50%; transform: translate(-50%, -50%); overflow: hidden; background: #d6d6db; user-select: none; -webkit-user-select: none; }
  #desk { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #stage.picking, #stage.picking * { cursor: none !important; }

  /* Palit in the menu bar */
  /* No logo yet, not even a placeholder: the menu bar shows the word (entry 107). Daeun designs the mark. */
  .mbi { position: absolute; z-index: 25; height: 22px; transform: translate(-50%, -50%); border: 0; padding: 0 7px; background: none; border-radius: 5px; font: 13px var(--font); letter-spacing: -0.003em; color: #1d1d1f; cursor: default; }
  .mbi:hover, .mbi[aria-expanded="true"], .mbi.picking { background: rgba(0, 0, 0, 0.1); }
  /* v3 (entry 160): a temporary square in place of the word, filled with the last color you kept, until Daeun designs the mark.
     Empty, it's an outline: nothing kept yet. The hairline keeps a light color visible on the light menu bar. */
  .mbi { display: grid; place-items: center; padding: 0 6px; }
  .mbi .mark { display: block; width: 14px; height: 14px; background: var(--mk, transparent); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.3); transition: background-color 240ms cubic-bezier(.2, .8, .2, 1); }

  /* The desktop palette: slim strips at the edge (A64) */
  .strips { position: absolute; right: 0; top: 50%; transform: translateY(-50%); z-index: 15; display: flex; flex-direction: column; gap: 3px; padding: 7px 6px; background: rgba(246, 246, 248, 0.72); -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4); border-radius: 10px 0 0 10px; box-shadow: 0 8px 22px rgba(0, 0, 0, 0.14), 0 0 0 0.5px rgba(0, 0, 0, 0.2); }
  .strips button { width: 6px; height: 26px; border: 0; padding: 0; background: var(--c); cursor: pointer; transition: width 240ms cubic-bezier(.2, .8, .2, 1); }
  .strips:hover button, .strips:focus-within button, .strips.open button { width: 26px; }
  .strips button.landed { animation: land 900ms ease-out; }
  @keyframes land { 0% { box-shadow: 0 0 0 2px #fff, 0 0 0 3px #1d1d1f; } 100% { box-shadow: 0 0 0 0 transparent; } }
  .strips .pinmark { height: 2px; background: #1d1d1f; margin: -1px 0 3px; }
  .note { position: absolute; z-index: 16; padding: 4px 9px; background: rgba(255, 255, 255, 0.94); border-radius: 6px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.14), 0 0 0 0.5px rgba(0, 0, 0, 0.16); font-size: 12px; white-space: nowrap; pointer-events: none; animation: fadeIn 180ms ease-out both; }

  /* Keeping a color: the loupe, the ring, the name beside the cursor */
  /* v2-loupe, not loupe: the shared stylesheet's .loupe (v1's) starts hidden */
  .v2-loupe { position: absolute; z-index: 60; width: 54px; height: 54px; border-radius: 50%; background: var(--c, #ccc); transform: translate(-50%, -50%); pointer-events: none; box-shadow: 0 0 0 2px #fff, 0 0 0 2.5px rgba(0, 0, 0, 0.4), 0 8px 18px rgba(0, 0, 0, 0.28); }
  .v2-loupe::after { content: ""; position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; transform: translate(-50%, -50%); box-shadow: 0 0 0 1px #fff, 0 0 0 2px rgba(0, 0, 0, 0.45); }
  .v2-loupe .hx { position: absolute; left: 50%; top: calc(100% + 10px); transform: translateX(-50%); padding: 2px 7px; border-radius: 5px; background: rgba(29, 29, 31, 0.82); color: #fff; font-size: 11px; white-space: nowrap; }
  .ring { position: absolute; z-index: 59; width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35); pointer-events: none; animation: ring 560ms ease-out forwards; }
  @keyframes ring { from { opacity: 1; transform: translate(-50%, -50%) scale(0.7); } to { opacity: 0; transform: translate(-50%, -50%) scale(1.7); } }
  .namer { position: absolute; z-index: 61; display: grid; grid-template-columns: 22px 220px; gap: 8px; align-items: center; padding: 8px 10px; background: rgba(255, 255, 255, 0.97); border-radius: 8px; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22), 0 0 0 0.5px rgba(0, 0, 0, 0.2); animation: fadeIn 160ms ease-out both; }
  .namer i { width: 22px; height: 22px; background: var(--c); }
  .namer input { border: 0; outline: none; font: 14px var(--font); background: none; }
  .namer p { grid-column: 2; font-size: 11px; color: var(--ink-2); }

  /* Palit's window, after the story workshop (entries 124 to 154): a white top bar of Palit's own, not a Mac toolbar (A77) */
  .pw { position: absolute; left: 150px; top: 62px; width: 1120px; height: 776px; z-index: 20; display: flex; flex-direction: column; background: var(--paper); border-radius: 12px; overflow: hidden; box-shadow: 0 32px 90px rgba(0, 0, 0, 0.3), 0 0 0 0.5px rgba(0, 0, 0, 0.26); animation: fadeIn 240ms ease-out both; }
  .pw[hidden] { display: none; }
  .bar { flex: none; height: 56px; display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto auto; align-items: center; gap: 16px; padding: 0 16px; border-bottom: 1px solid #ededef; }
  .lights { display: flex; gap: 8px; }
  .lights button { width: 12px; height: 12px; border-radius: 50%; border: 0; padding: 0; background: #ff5f57; box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.14); cursor: pointer; }
  .lights button:nth-child(2) { background: #febc2e; } .lights button:nth-child(3) { background: #28c840; }
  .hue { display: flex; align-items: center; }
  .letters { display: flex; }
  .letters button { position: relative; width: 28px; height: 30px; border: 0; background: none; cursor: pointer; font-size: 13px; color: var(--ink-2); }
  .letters button:hover { color: var(--ink); }
  .letters button[aria-pressed="true"] { color: var(--ink); }
  .letters button[aria-pressed="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 3px; height: 2px; background: #1d1d1f; }   /* ink, not the letter's hue (A83) */
  .letters button:disabled { color: #d8d8db; cursor: default; }
  /* All colors, by hue: a plain ink ring, with a dot when it's on (A80) */
  .wheel { width: 26px; height: 26px; margin-left: 8px; border: 0; padding: 0; border-radius: 6px; background: none; cursor: pointer; display: grid; place-items: center; color: var(--ink-2); }
  .wheel svg { width: 18px; height: 18px; }
  .wheel:hover { color: var(--ink); background: rgba(0, 0, 0, 0.05); }
  .wheel[aria-pressed="true"] { color: var(--ink); background: rgba(0, 0, 0, 0.07); }
  .wheel[aria-pressed="true"] .hub { fill: currentColor; }
  .wheel:disabled { color: #d8d8db; background: none; cursor: default; }
  .tabs { justify-self: center; display: flex; gap: 26px; }
  .tabs button { position: relative; border: 0; background: none; padding: 8px 0; cursor: pointer; font-size: 14px; color: var(--ink-2); }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-pressed="true"] { color: var(--ink); }
  .tabs button[aria-pressed="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: 2px; height: 1.5px; background: #1d1d1f; }
  .search { width: 180px; height: 30px; display: flex; align-items: center; gap: 7px; padding: 0 10px; border-radius: 8px; background: #f3f3f5; box-sizing: border-box; }
  .search::before { content: ""; flex: none; width: 9px; height: 9px; border: 1.5px solid var(--ink-2); border-radius: 50%; }
  .search input { flex: 1; min-width: 0; border: 0; outline: none; background: none; font-size: 13px; }
  /* The zoom: four stops, each its own idea (A87), − and + with a dot for each */
  .zoom { display: flex; align-items: center; gap: 2px; }
  .zoom > button { width: 26px; height: 26px; border: 0; background: none; border-radius: 6px; cursor: pointer; font-size: 16px; color: var(--ink-2); }
  .zoom > button:hover { background: rgba(0, 0, 0, 0.05); color: var(--ink); }
  .zoom > button:disabled { color: #c7c7cc; background: none; cursor: default; }
  .zoom > button.flash { background: rgba(0, 0, 0, 0.08); color: var(--ink); }
  .zdots { display: flex; align-items: center; gap: 2px; }
  .zdots button { width: 12px; height: 26px; padding: 0; border: 0; background: none; cursor: pointer; display: grid; place-items: center; }
  .zdots button::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: #d1d1d6; }
  .zdots button:hover::before { background: var(--ink-2); }
  .zdots button[aria-pressed="true"]::before { background: #1d1d1f; }
  .main { flex: 1; min-height: 0; display: grid; grid-template-columns: 58px minmax(0, 1fr); }
  .main.norail { grid-template-columns: minmax(0, 1fr); }
  .main.norail .rail { display: none; }
  /* The days of the week down the left, the way ROYGBIV runs across the top (A79, A86); the arrow sifts by week and month */
  .rail { position: relative; border-right: 1px solid #f1f1f3; padding: 14px 0 0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .rail .wk { font-size: 10px; line-height: 1.25; color: var(--ink-2); text-align: center; margin-bottom: 8px; white-space: pre-line; }
  .rail .wd { position: relative; width: 32px; height: 30px; border: 0; background: none; padding: 0; cursor: pointer; font-size: 13px; color: var(--ink-2); }
  .rail .wd:hover, .rail .wd.on { color: var(--ink); }
  .rail .wd.on::after { content: ""; position: absolute; left: 9px; right: 9px; bottom: 3px; height: 2px; background: #1d1d1f; }
  .rail .wd:disabled { color: #d8d8db; cursor: default; }
  .rail .wd.today::before { content: ""; position: absolute; right: 3px; top: 9px; width: 4px; height: 4px; border-radius: 50%; background: #1d1d1f; }
  .rail .wd.today:disabled::before { background: #d8d8db; }
  .rail .wmore { width: 32px; height: 26px; margin-top: 8px; border: 0; background: none; border-radius: 6px; cursor: pointer; display: grid; place-items: center; color: var(--ink-2); }
  .rail .wmore:hover, .rail .wmore[aria-expanded="true"] { background: rgba(0, 0, 0, 0.05); color: var(--ink); }
  .rail .wmore svg { width: 10px; height: 6px; }
  .wmenu { position: absolute; z-index: 60; min-width: 190px; padding: 5px; background: rgba(250, 250, 251, 0.97); border-radius: 8px; box-shadow: 0 12px 34px rgba(0, 0, 0, 0.2), 0 0 0 0.5px rgba(0, 0, 0, 0.24); font-size: 13px; animation: fadeIn 110ms ease-out both; }
  .wmenu .mh2 { padding: 4px 9px 3px; font-size: 11px; color: var(--ink-2); }
  .wmenu button { display: flex; align-items: center; gap: 8px; width: 100%; height: 24px; padding: 0 9px; border: 0; background: none; border-radius: 4px; text-align: left; cursor: default; font-size: 13px; }
  .wmenu button:hover { background: rgba(0, 0, 0, 0.08); }
  .wmenu button .ck { width: 12px; flex: none; }
  .wmenu button .rt { margin-left: auto; padding-left: 14px; color: var(--ink-2); font-size: 12px; }
  .wmenu hr { border: 0; height: 1px; margin: 5px 9px; background: rgba(0, 0, 0, 0.1); }
  .pw-body { position: relative; overflow-y: auto; overflow-x: hidden; min-width: 0; }
  /* Each view keeps what's inside it inside it (the fan's cards, the table's buttons), under the card and the menus. Its
     fade-in used to do that by holding its opacity; the views now come in piece by piece, so it's said outright. */
  .pw-body > * { animation: fadeIn 240ms ease-out both; isolation: isolate; }
  .pw-count { position: absolute; right: 18px; bottom: 12px; z-index: 30; font-size: 11px; color: var(--ink-2); pointer-events: none; background: rgba(255, 255, 255, 0.9); padding: 1px 6px; border-radius: 4px; }
  .tbtn { border: 0; background: rgba(0, 0, 0, 0.05); padding: 4px 11px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .tbtn:hover { background: rgba(0, 0, 0, 0.09); }
  .tbtn.ink { background: #1d1d1f; color: #fff; }
  .tbtn:disabled { opacity: 0.4; cursor: default; }
  .tbtn[aria-pressed="true"] { background: #1d1d1f; color: #fff; }
  .empty { padding: 60px 22px; border: 0; color: var(--ink-2); font-size: 13px; }   /* no dashed box: that was v1's */

  /* Tiles: one typeface, unbolded SF Pro (A30, A78); names you haven't given yet dimmed */
  .t { position: relative; border: 0; padding: 0; background: var(--c); color: var(--on); overflow: hidden; cursor: pointer; text-align: left; transition: flex-grow 320ms cubic-bezier(.2, .8, .2, 1); animation: fadeIn 300ms ease-out both; }
  .t:hover, .t:focus-visible { flex-grow: 1.6; z-index: 2; outline: none; }
  .t .nm { position: absolute; left: 10px; right: 10px; bottom: 9px; font-size: var(--ts, 12px); line-height: 1.12; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t .nm.ph { opacity: 0.6; }
  .t .pin { position: absolute; right: 8px; top: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--on); }
  /* Selected with ⇧-click: an ink edge, then a white line inside it, so it shows on light colors and dark ones alike */
  .t.sel { box-shadow: inset 0 0 0 2px #1d1d1f, inset 0 0 0 4px #fff; }
  .fan-card.sel { box-shadow: inset 0 0 0 2px #1d1d1f, inset 0 0 0 4px #fff, 0 1px 2px rgba(0, 0, 0, 0.06), 0 6px 16px rgba(0, 0, 0, 0.07); }
  .lbl { margin-top: 5px; font-size: 11px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Days, each with its places (A72): compact as the letters when zoomed out; open a day to see its hunt */
  .days { padding: 6px 22px 54px 20px; }
  .day + .day { margin-top: 18px; }
  .dh { display: flex; align-items: baseline; gap: 10px; border: 0; background: none; padding: 0 0 8px; cursor: pointer; text-align: left; }
  .dh b { font-weight: 400; font-size: var(--dhs, 22px); letter-spacing: -0.02em; line-height: 1; }
  .dh span { font-size: 12px; color: var(--ink-2); }
  .dh i { width: 6px; height: 6px; border-right: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3); transform: rotate(-45deg); margin-left: 2px; align-self: center; transition: transform 200ms; }
  .dh[aria-expanded="true"] i { transform: rotate(45deg); }
  .dh:hover b { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .day.compact { display: grid; grid-template-columns: 168px minmax(0, 1fr); align-items: center; }
  .day.compact + .day.compact { margin-top: 6px; }
  .day.compact .dh { padding: 0; }
  .day.compact .dh b { font-size: 13px; letter-spacing: 0; }
  .strip { display: flex; gap: 2px; height: var(--sh, 26px); }
  .strip .t { flex: 1; animation: none; }
  .row { display: flex; flex-wrap: wrap; gap: 3px; }
  .row .t { flex: 1 0 var(--tw, 104px); max-width: calc(var(--tw, 104px) * 2.4); height: var(--th, 92px); }
  .pls { display: flex; flex-wrap: wrap; gap: 14px 18px; }
  .pg { flex: 1 1 260px; min-width: 0; }
  .pg .w { font-size: 12px; color: var(--ink-2); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pg .w b { font-weight: 400; color: var(--ink); }
  .pg .cs { display: flex; gap: 3px; }
  .pg .cs > div { flex: 1; min-width: 0; }
  .pg .cs .t { width: 100%; height: var(--th, 104px); }
  .hunt { display: grid; grid-template-columns: 200px var(--hh, 96px) minmax(0, 1fr); gap: 3px; margin-bottom: 3px; }
  .hunt .st { padding: 2px 14px 0 0; min-width: 0; }
  .hunt .st .w { font-size: 15px; line-height: 1.15; letter-spacing: -0.012em; }
  .hunt .st .v { font-size: 11.5px; color: var(--ink-2); margin-top: 3px; line-height: 1.3; }
  .hunt .src { width: var(--hh, 96px); height: var(--hh, 96px); }
  .hunt .cs { display: flex; gap: 3px; min-width: 0; height: var(--hh, 96px); }
  .hunt .cs .t { flex: 1 1 0; max-width: 230px; }
  .src { position: relative; overflow: hidden; background: #e9e9eb; }
  .src img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .src.mos { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
  .src.mos i { display: block; }

  /* All colors, by hue: the fan, in Days behind the ring (A74, A81, A91). 168 by 274, 12° apart, the chosen card lifted 124px */
  .fan { position: absolute; inset: 0; overflow: hidden; touch-action: none; }
  .fan:focus-visible { outline: none; }
  .fan-cap { position: absolute; left: 28px; top: 18px; z-index: 300; max-width: 52%; pointer-events: none; }
  .fan-cap .nm { font-size: 50px; line-height: 1; letter-spacing: -0.045em; }
  .fan-cap .nm.ph { color: var(--ink-2); }
  .fan-cap .mt { margin-top: 10px; font-size: 12px; color: var(--ink-2); }
  .fan-card { position: absolute; left: calc(50% - 84px); bottom: 54px; width: 168px; height: 274px; background: var(--c); color: var(--on); transform-origin: 50% 632px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 6px 16px rgba(0, 0, 0, 0.07); cursor: pointer; transition: transform 320ms cubic-bezier(.2, .8, .2, 1), opacity 320ms; }
  .fan-card .fno { position: absolute; left: 10px; bottom: 8px; font-size: 10px; letter-spacing: 0.01em; opacity: 0.5; }

  /* Palettes: what you pinned, your palettes, and what's shared with you; a palette opens as a study (A74) */
  .pals { padding: 4px 22px 44px 20px; }
  .sub-h { padding: 18px 0 8px; font-size: 12px; color: var(--ink-2); }
  .sub-h:first-child { padding-top: 12px; }
  .pins { display: flex; flex-wrap: wrap; gap: 3px; }
  .pins .t { flex: 0 0 150px; height: 120px; max-width: none; }
  .pins .t .nm { font-size: 14px; }
  .pal { display: grid; grid-template-columns: minmax(0, 240px) minmax(0, 1fr) auto; gap: 22px; align-items: center; padding: 14px 0; border-top: 1px solid var(--rule-soft); }
  .pal.open-able { cursor: pointer; }
  .pal .pn { font-size: 20px; line-height: 1.1; letter-spacing: -0.02em; }
  .pal .pn.ph { color: var(--ink-2); }
  .pal .pm { margin-top: 4px; font-size: 11px; color: var(--ink-2); }
  .pal .pstrip { display: flex; height: 60px; }
  .pal .pstrip i { flex: 1; }
  .pal .pstrip .none { flex: 1; align-self: center; font-size: 12px; color: var(--ink-2); font-style: normal; }
  .pal .acts { display: flex; gap: 6px; }
  .pal.open-able:hover .pn { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .study { padding: 16px 22px 40px 20px; }
  .back { border: 0; background: none; padding: 0; color: var(--ink-2); cursor: pointer; font-size: 12px; }
  .back:hover { color: var(--ink); }
  .study-h { display: flex; align-items: baseline; gap: 14px; margin-top: 10px; }
  .study-h .sn2 { font-size: 34px; letter-spacing: -0.03em; line-height: 1; outline: none; border-radius: 3px; min-width: 40px; }
  .study-h .sn2:empty::before { content: attr(data-placeholder); color: var(--ink-2); }
  .study-h .sn2:focus { box-shadow: 0 0 0 2px rgba(29, 29, 31, 0.12); }
  .study-h span.meta { font-size: 12px; color: var(--ink-2); }
  .study-h .acts { margin-left: auto; display: flex; gap: 6px; }
  .cols { display: grid; gap: 3px; margin-top: 16px; }
  .col .big { position: relative; height: 250px; cursor: pointer; }
  .col .big .nm { position: absolute; left: 12px; bottom: 10px; font-size: 15px; letter-spacing: -0.01em; }
  .col .big .nm.ph { opacity: 0.6; }
  .grounds { display: grid; grid-template-columns: repeat(3, 1fr); height: 72px; margin-top: 3px; }
  .grounds div { display: grid; place-items: center; }
  .grounds i { display: block; width: 28px; height: 28px; }
  .col .meta { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; align-items: center; margin-top: 10px; font-size: 11.5px; }
  .col .meta .src { width: 30px; height: 30px; }
  .col .meta .v { color: var(--ink-2); }
  .col .codes { margin-top: 6px; font-size: 11.5px; color: var(--ink-2); }
  .col .codes b { font-weight: 400; color: var(--ink); }
  .ver { margin-top: 14px; font-size: 12px; color: var(--ink-2); }

  /* Table: try colors together (A74, A84, A85). Grounds to set them on, a search at the bottom, names when you ask. */
  .table { position: absolute; inset: 0; background: #efeff0; overflow: hidden; }
  .table .hint { position: absolute; left: 22px; top: 16px; font-size: 13px; color: var(--ink-2); pointer-events: none; }
  .table .acts { position: absolute; right: 20px; top: 12px; display: flex; gap: 6px; z-index: 50; }
  .ground { position: absolute; width: 150px; height: 150px; }
  .ground p { position: absolute; left: 0; top: calc(100% + 6px); font-size: 11px; color: var(--ink-2); }
  .chip { position: absolute; width: 96px; height: 96px; cursor: grab; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.14), 0 6px 14px rgba(0, 0, 0, 0.1); touch-action: none; }
  .chip:active { cursor: grabbing; }
  .chip .nm { position: absolute; left: 8px; right: 8px; bottom: 6px; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--on); display: none; }
  .table.named .chip .nm { display: block; }
  .tsearch { position: absolute; left: 50%; bottom: 20px; z-index: 45; width: 340px; transform: translateX(-50%); }
  .tfield { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; background: #fff; border-radius: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12), 0 0 0 0.5px rgba(0, 0, 0, 0.18); }
  .tfield::before { content: ""; flex: none; width: 10px; height: 10px; border: 1.5px solid var(--ink-2); border-radius: 50%; }
  .tfield input { flex: 1; min-width: 0; border: 0; outline: none; background: none; font-size: 14px; }
  .tres { list-style: none; margin: 0 0 6px; padding: 5px; background: rgba(250, 250, 251, 0.98); border-radius: 10px; box-shadow: 0 12px 34px rgba(0, 0, 0, 0.16), 0 0 0 0.5px rgba(0, 0, 0, 0.18); }
  .tres:empty { display: none; }
  .tres li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: center; padding: 5px 8px; border-radius: 6px; cursor: pointer; }
  .tres li:hover, .tres li.hi { background: rgba(0, 0, 0, 0.07); }
  .tres i { width: 22px; height: 22px; }
  .tres b { display: block; font-weight: 400; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tres b.ph { opacity: 0.6; }
  .tres span { display: block; font-size: 11px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tres .none { display: block; padding: 6px 8px; font-size: 12px; color: var(--ink-2); cursor: default; }
  .tres .none:hover { background: none; }

  /* Search: find it again (A76) */
  .res { padding: 4px 22px 40px 20px; }
  .res .q { font-size: 12px; color: var(--ink-2); margin: 8px 0; }
  .res ul { margin: 0; padding: 0; }
  .res li { list-style: none; display: grid; grid-template-columns: 150px 72px minmax(0, 1fr); gap: 14px; align-items: center; padding: 8px 0; border-top: 1px solid var(--rule-soft); cursor: pointer; }
  .res .t { height: 72px; }
  .res .src { width: 72px; height: 72px; }
  .res .w { font-size: 17px; letter-spacing: -0.015em; }
  .res .w.ph { color: var(--ink-2); }
  .res .v { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
  .res mark { background: none; color: inherit; box-shadow: inset 0 -2px 0 rgba(29, 29, 31, 0.45); }

  /* First open: the opinion as the empty window (A71, A75), then the first hunt */
  .first { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .first .big { font-size: 36px; letter-spacing: -0.03em; line-height: 1.1; }
  .first .small { margin-top: 14px; font-size: 14px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; justify-content: center; }
  .first .tiny { margin-top: 22px; font-size: 12px; color: var(--ink-3); }
  .kc { font: 13px/1 var(--font); min-width: 24px; height: 24px; padding: 0 6px; display: inline-grid; place-items: center; background: linear-gradient(#fff, #f1f1f3); color: var(--ink); border: 0.5px solid rgba(0, 0, 0, 0.18); border-radius: 6px; box-shadow: 0 1px 0 rgba(0, 0, 0, 0.12); }
  .keys { border: 0; background: none; padding: 0; display: inline-flex; gap: 6px; cursor: pointer; }
  .huntpill { position: absolute; left: 50%; top: 52px; z-index: 70; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 10px 18px; background: rgba(255, 255, 255, 0.96); border-radius: 12px; box-shadow: 0 12px 34px rgba(0, 0, 0, 0.22), 0 0 0 0.5px rgba(0, 0, 0, 0.2); font-size: 17px; white-space: nowrap; pointer-events: none; animation: fadeIn 200ms ease-out both; }
  .huntpill span { color: var(--ink-2); }

  /* What you've gathered with ⇧-click (A67): a quiet bar at the bottom of the window */
  .selpill { position: absolute; left: 50%; bottom: 18px; z-index: 44; display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 10px; transform: translateX(-50%); background: rgba(255, 255, 255, 0.97); border-radius: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16), 0 0 0 0.5px rgba(0, 0, 0, 0.18); animation: fadeIn 160ms ease-out both; }
  .selpill .ss { display: flex; height: 18px; }
  .selpill .ss i { width: 16px; }
  .selpill .sn { font-size: 12px; color: var(--ink-2); margin: 0 4px 0 2px; white-space: nowrap; }

  /* Playback (entry 112): a drawn cursor and keystroke chips, so the demo records hands-free */
  .pcursor { position: absolute; left: 0; top: 0; z-index: 100; width: 22px; height: 30px; pointer-events: none; }
  .pcursor[hidden] { display: none; }
  .pcursor svg { display: block; transform-origin: 3px 3px; transition: transform 110ms ease-out; filter: drop-shadow(0 1px 1.5px rgba(0, 0, 0, 0.35)); }
  .pcursor.down svg { transform: scale(0.84); }
  .pkeys { position: absolute; left: 50%; bottom: 34px; z-index: 95; display: flex; gap: 6px; transform: translateX(-50%); opacity: 0; transition: opacity 180ms ease-out; pointer-events: none; }
  .pkeys.on { opacity: 1; }
  .pkeys kbd { min-width: 18px; padding: 7px 13px; border-radius: 9px; background: rgba(29, 29, 31, 0.84); color: #fff; font: 16px var(--font); text-align: center; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22); }
  body.nokeys .pkeys { display: none; }
  body.playing #stage, body.playing #stage * { cursor: none !important; }
  /* While it plays, a shield over the stage keeps a real mouse from pointing at anything. The drawn cursor does the pointing,
     and what it points at answers the way it would a mouse (hoverTick, below). */
  .pshield { position: absolute; inset: 0; z-index: 5; display: none; cursor: none; }
  body.playing .pshield { display: block; }

  /* The menu (entry 116): right-click a color, or Add to palette. A Mac menu, kept neutral so only the colors have color. */
  .menu { position: absolute; z-index: 80; min-width: 216px; max-width: 300px; padding: 5px; box-sizing: border-box; background: rgba(248, 248, 250, 0.95); -webkit-backdrop-filter: blur(24px) saturate(1.2); backdrop-filter: blur(24px) saturate(1.2); border-radius: 8px; box-shadow: 0 12px 34px rgba(0, 0, 0, 0.22), 0 0 0 0.5px rgba(0, 0, 0, 0.26); font-size: 13px; animation: fadeIn 110ms ease-out both; }
  .menu .mi { display: flex; align-items: center; gap: 8px; width: 100%; height: 24px; padding: 0 9px 0 7px; border: 0; background: none; border-radius: 4px; text-align: left; cursor: default; white-space: nowrap; }
  .menu .mi:hover, .menu .mi:focus-visible, .menu .mi.open, .menu .mi.phover { background: rgba(0, 0, 0, 0.08); outline: none; }
  .menu .mi:disabled { color: #b0b0b5; background: none; }
  .menu .ck { flex: none; width: 12px; text-align: center; color: var(--ink); }
  .menu .lb { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .menu .lb.ph { color: var(--ink-2); }
  .menu .rt { flex: none; margin-left: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .menu .chev { flex: none; width: 6px; height: 10px; margin-left: 12px; }
  .menu .ms { flex: none; display: flex; width: 30px; height: 12px; }
  .menu .ms i { flex: 1; }
  .menu .ms.blank { box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.18); }
  .menu .mh { display: flex; align-items: center; gap: 8px; padding: 3px 9px 6px 7px; font-size: 11px; color: var(--ink-2); }
  .menu .mh .ms { width: auto; }
  .menu .mh .ms i { width: 12px; }
  .menu hr { border: 0; height: 1px; margin: 5px 9px; background: rgba(0, 0, 0, 0.1); }
  /* A quiet line at the bottom of the window when something is added (entry 116) */
  .toast { position: absolute; left: 50%; bottom: 16px; z-index: 45; display: flex; align-items: center; gap: 10px; padding: 7px 14px 7px 8px; transform: translateX(-50%); background: rgba(255, 255, 255, 0.96); border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16), 0 0 0 0.5px rgba(0, 0, 0, 0.18); font-size: 12px; white-space: nowrap; pointer-events: none; animation: fadeIn 160ms ease-out both; }
  .toast .ms { display: flex; height: 18px; }
  .toast .ms i { width: 14px; }
  .toast.out { opacity: 0; transition: opacity 260ms; }

  /* The specimen card (A60, A61): the color over where you found it, your name as the hero, the scratch pad */
  .sheet { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(246, 246, 247, 0.74); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); animation: fadeIn 220ms ease-out both; }
  .spec { position: relative; width: 880px; height: 580px; display: grid; grid-template-columns: 45% 55%; background: var(--paper); box-shadow: 0 26px 64px rgba(0, 0, 0, 0.22), 0 0 0 0.5px rgba(0, 0, 0, 0.18); }
  .sp-src { position: relative; overflow: hidden; background: #e9e9eb; }
  .sp-src .crop { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .sp-src .nb { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
  .sp-chip { position: absolute; left: 50%; top: 48%; width: 46%; transform: translate(-50%, -50%); background: var(--paper); padding: 8px 8px 0; box-shadow: 0 16px 34px rgba(0, 0, 0, 0.26); }
  .sp-chip .sw { width: auto; height: auto; aspect-ratio: 1 / 1.05; box-shadow: none; }
  .sp-chip .lb { display: flex; justify-content: space-between; font-size: 11px; padding: 7px 2px 8px; }
  .sp-form { display: flex; flex-direction: column; min-width: 0; padding: 24px 28px 20px; }
  .sp-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--ink-2); }
  .sp-x { border: 0; background: none; font-size: 18px; line-height: 1; color: var(--ink-3); cursor: pointer; padding: 0 2px; }
  .sp-x:hover { color: var(--ink); }
  .sp-nm { margin-top: 8px; font-size: 54px; line-height: 0.98; letter-spacing: -0.045em; outline: none; overflow-wrap: anywhere; border-radius: 3px; }
  .sp-nm:empty::before { content: attr(data-placeholder); color: var(--ink-2); }
  .sp-nm:focus { box-shadow: 0 0 0 2px rgba(29, 29, 31, 0.12); }
  .sp-hint { margin-top: 6px; font-size: 11px; color: var(--ink-2); }
  .sp-rows { display: grid; grid-template-columns: 76px minmax(0, 1fr); margin: 16px 0 0; font-size: 12px; }
  .sp-rows dt { color: var(--ink-2); padding: 6px 0; border-top: 1px solid var(--rule-soft); }
  .sp-rows dd { margin: 0; padding: 6px 0; border-top: 1px solid var(--rule-soft); min-width: 0; }
  .sp-rows dd button { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; }
  .sp-rows dd button:hover { text-decoration: underline; text-underline-offset: 2px; }
  .vals { display: flex; gap: 14px; flex-wrap: wrap; }
  .sim { display: flex; flex-direction: column; gap: 3px; }
  .sim button { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 8px; align-items: center; }
  .sim i { width: 14px; height: 14px; }
  .sp-strip { display: flex; height: 14px; margin-top: 2px; }
  .sp-strip i { flex: 1; }
  .sp-pals { display: flex; flex-direction: column; gap: 5px; }
  .sp-pal { display: grid; grid-template-columns: minmax(0, 1fr) 112px; gap: 12px; align-items: center; }
  .sp-pal .pl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sp-pal .sp-strip { margin-top: 0; }
  .sp-acts { display: flex; gap: 6px; margin-top: 12px; }
  .sp-acts .tbtn[aria-pressed="true"] { background: #1d1d1f; color: #fff; }
  /* The trail you followed to get here (D19, entry 124), and the other colors from the same place, as one strip */
  .trail { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 12px; color: var(--ink-2); min-width: 0; }
  .trail button { border: 0; background: none; padding: 0; cursor: pointer; color: var(--ink-2); font-size: 12px; }
  .trail button:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
  .trail .here-now { color: var(--ink); }
  .trail .sep { color: var(--ink-3); }
  .here { display: flex; height: 22px; max-width: 220px; }
  .sp-rows .here button { flex: 1 1 0; min-width: 0; height: 100%; border: 0; padding: 0; cursor: pointer; background: var(--c); }
  .sp-rows .here button:hover { box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 3px #1d1d1f; text-decoration: none; }
  .pad { margin-top: auto; padding-top: 12px; }
  .pad label { display: block; font-size: 11px; color: var(--ink-2); margin-bottom: 2px; }
  .pad textarea { display: block; width: 100%; height: 60px; resize: none; border: 0; outline: none; padding: 0; font: 13px/20px var(--font); background: repeating-linear-gradient(transparent 0 19px, var(--rule-soft) 19px 20px); box-sizing: border-box; }

  /* A share card (entry 109): the colors and their codes, ready to send */
  .share { width: 600px; background: var(--paper); box-shadow: 0 26px 64px rgba(0, 0, 0, 0.22), 0 0 0 0.5px rgba(0, 0, 0, 0.18); padding: 22px; }
  .sc { border: 1px solid var(--rule-soft); }
  .sc-chips { display: flex; height: 190px; }
  .sc-chips i { flex: 1; }
  .sc-names { display: grid; border-top: 1px solid var(--rule-soft); }
  .sc-names div { padding: 9px 10px 11px; font-size: 12px; min-width: 0; }
  .sc-names div + div { border-left: 1px solid var(--rule-soft); }
  .sc-names b { display: block; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sc-names span { color: var(--ink-2); font-size: 11px; }
  .sc-foot { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 12px 12px; border-top: 1px solid var(--rule-soft); }
  .sc-foot .tt { font-size: 22px; letter-spacing: -0.025em; }
  .sc-foot .by { font-size: 11px; color: var(--ink-2); }
  .share .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

  /* The controls under the stage */
  #controls { position: fixed; left: 0; right: 0; bottom: 0; height: var(--ctl, 76px); box-sizing: border-box; padding: 10px 20px; background: #1c1c1e; color: #e5e5ea; font-size: 12px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
  body.clean #controls { display: none; }
  .c-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .c-lb { color: #8e8e93; }
  .c-seg { display: inline-flex; background: #2c2c2e; border-radius: 7px; padding: 2px; }
  .c-seg button, .c-btn { border: 0; background: none; color: #e5e5ea; padding: 3px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; }
  .c-seg button[aria-pressed="true"] { background: #48484a; }
  .c-btn { background: #2c2c2e; }
  .c-sel { border: 0; background: #2c2c2e; color: #e5e5ea; padding: 4px 8px; border-radius: 6px; font: inherit; font-size: 12px; cursor: pointer; }
  .c-btn:hover, .c-seg button:hover { background: #3a3a3c; }
  .c-hint { color: #8e8e93; }
  .c-hint b { color: #e5e5ea; font-weight: 400; }
  kbd { font: inherit; font-size: 11px; color: #8e8e93; margin-left: 4px; }
  .c-grow { flex: 1; }
  .c-row2 { flex-wrap: nowrap; align-items: baseline; }
  .c-row2 .c-hint { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c-credit { flex: 0 1 auto; max-width: 42%; color: #636366; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }

  /* ---------- v3 (entry 156): v2 with a switch for each piece added since this afternoon, so the v3 workshop can
     show as it was, now, and the middle, live. Each switch is a class on the window; with no switches it's v2 as merged. ---------- */
  .pw.shell-native .bar { height: 52px; background: #f6f6f7; border-bottom: 0.5px solid rgba(0, 0, 0, 0.12); }
  .pw.shell-native .tabs { gap: 0; padding: 2px; background: rgba(0, 0, 0, 0.07); border-radius: 8px; }
  .pw.shell-native .tabs button { padding: 4px 16px; border-radius: 6px; font-size: 13px; color: var(--ink); }
  .pw.shell-native .tabs button[aria-pressed="true"] { background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12), 0 0 0 0.5px rgba(0, 0, 0, 0.08); }
  .pw.shell-native .tabs button[aria-pressed="true"]::after { display: none; }
  .pw.shell-native .search { background: rgba(0, 0, 0, 0.06); }
  /* With the letters in their own row, the tabs sit in the middle of the window, the way the Mac centers a toolbar's control */
  .pw.lt-row .bar { position: relative; display: flex; }
  .pw.lt-row .bar .search { margin-left: auto; }
  .pw.lt-row .bar .tabs { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .hrow { flex: none; height: 46px; display: flex; align-items: center; padding: 0 18px 0 14px; }
  .hrow .hue { flex: none; }
  .hrow .pw-count.inrow { position: static; margin-left: auto; background: none; padding: 0; }
  .pw.lt-row.shell-words .hrow { height: 44px; }
  /* Spectrum as a tab: the ring goes */
  .pw.sp-tab .wheel { display: none; }
  /* Search behind a magnifier until you click it or press ⌘F */
  .pw.s-icon .search { width: 30px; padding: 0; justify-content: center; background: none; cursor: pointer; border-radius: 6px; transition: width 200ms cubic-bezier(.2, .8, .2, 1); }
  .pw.s-icon .search:hover { background: rgba(0, 0, 0, 0.05); }
  .pw.s-icon .search input { display: none; }
  .pw.s-icon .search::before { width: 14px; height: 14px; border: 0; border-radius: 0; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 14 14'><circle cx='5.8' cy='5.8' r='4.4' fill='none' stroke='%236b6b70' stroke-width='1.4'/><path d='M9.1 9.1 12.6 12.6' stroke='%236b6b70' stroke-width='1.4' stroke-linecap='round'/></svg>") center / 14px no-repeat; }
  .pw.s-icon .search.open { width: 180px; padding: 0 10px; justify-content: flex-start; background: #f3f3f5; cursor: text; }
  .pw.s-icon.shell-native .search.open { background: rgba(0, 0, 0, 0.06); }
  .pw.s-icon .search.open input { display: block; }
  /* The zoom without its dots: the stop's name shows for a moment as you turn it */
  .pw.z-plain .zdots { display: none; }
  .zname { position: absolute; z-index: 35; right: 16px; padding: 3px 9px; border-radius: 6px; background: rgba(29, 29, 31, 0.86); color: #fff; font-size: 12px; pointer-events: none; animation: zname 1300ms ease-out both; }
  @keyframes zname { 0% { opacity: 0; transform: translateY(-3px); } 12% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; } }
  /* How much each day says */
  .pw.d-date .dh span, .pw.d-date .dh i, .pw.d-small .dh span, .pw.d-small .dh i { display: none; }
  .pw.d-small .dh { padding-bottom: 6px; }
  .pw.d-small .dh b { font-size: 11px; letter-spacing: 0; color: var(--ink-2); }
  .pw.d-small .day:first-child .dh b { color: var(--ink); }
  .pw.d-small .dh:hover b { color: var(--ink); }
  /* Unnamed colors on two lines: the color word, then where it's from, so nothing is cut off */
  .table .tback { position: absolute; left: 22px; top: 18px; z-index: 5; }
  .table .tback ~ .hint { top: 46px; }
  .nm small { display: block; font-size: 1em; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- v3's polish (A97, entry 159): one type scale, one gray, one left edge, nothing on the colors, one motion,
     nothing cut off. Scoped to .polished, so ?cfg=polish:off shows the window the way the v3 workshop showed it. ---------- */
  :root { --ease: cubic-bezier(.2, .8, .2, 1); --move: 240ms; --off: #c7c7cc; }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

  /* One motion: every open, close, view change and zoom takes 240ms on the same ease. Menus stay quick, like the Mac's own. */
  .pw.polished { animation: fadeIn var(--move) var(--ease) both; }
  .pw.polished.out { animation: fadeOut var(--move) var(--ease) both; }
  .pw.polished .pw-body > * { animation: fadeIn var(--move) var(--ease) both; }
  .pw.polished .t { transition: flex-grow var(--move) var(--ease); animation: fadeIn var(--move) var(--ease) both; }
  .pw.polished .strip .t { animation: none; }
  .pw.polished .fan-card { transition: transform var(--move) var(--ease), opacity var(--move) var(--ease); }
  /* The fan turns a frame at a time (Noah, October 19), so its cards take no transitions of their own */
  .fan .fan-card, .pw.polished .fan .fan-card { transition: none; will-change: transform; }
  .pw.polished .sheet { animation: fadeIn var(--move) var(--ease) both; }
  .pw.polished .sheet.out { animation: fadeOut var(--move) var(--ease) both; }
  .pw.polished .toast, .pw.polished .selpill { animation: fadeIn var(--move) var(--ease) both; }
  .pw.polished .toast.out { animation: fadeOut var(--move) var(--ease) both; }
  .pw.polished.s-icon .search { transition: width var(--move) var(--ease), background-color var(--move) var(--ease); }
  body.polished .menu { animation: fadeIn 110ms var(--ease) both; }

  /* One type scale: 11 for what's said about a color, 13 for names and controls, 17 for dates and today, 26 for Today
     and a palette's title, and 50 for the one name a screen is about */
  .pw.polished .tabs button { font-size: 13px; }
  .pw.polished .zoom > button { font-size: 17px; }
  .pw.polished .t .nm { font-size: var(--ts, 13px); }
  .pw.polished .pg .w { font-size: 13px; }
  .pw.polished .pg .w .via { display: block; margin-top: 1px; font-size: 11px; color: var(--ink-2); }
  .pw.polished .hunt .st .w { font-size: 13px; }
  .pw.polished .hunt .st .v { font-size: 11px; }
  .pw.polished .fan-cap .mt { font-size: 11px; }
  .pw.polished .fan-card .fno { font-size: 11px; }
  .pw.polished .sub-h { font-size: 13px; }
  .pw.polished .pins .t .nm { font-size: 13px; }
  .pw.polished .pal .pn { font-size: 17px; }
  .pw.polished .pal .pstrip .none, .pw.polished .back, .pw.polished .table .hint, .pw.polished .tfield input, .pw.polished .tbtn { font-size: 13px; }
  .pw.polished .study-h .sn2 { font-size: 26px; }
  .pw.polished .study-h span.meta, .pw.polished .col .meta, .pw.polished .col .codes, .pw.polished .ver, .pw.polished .tres .none, .pw.polished .res .q, .pw.polished .res .v { font-size: 11px; }
  .pw.polished .col .big .nm { font-size: 17px; }
  .pw.polished .first .big { font-size: 50px; letter-spacing: -0.045em; line-height: 1; }
  .pw.polished .first .small { font-size: 13px; }
  .pw.polished .first .tiny { font-size: 11px; color: var(--ink-2); }
  .pw.polished .toast, .pw.polished .selpill .sn { font-size: 13px; }
  .pw.polished .sp-top, .pw.polished .trail, .pw.polished .trail button { font-size: 11px; }
  .pw.polished .sp-x { font-size: 17px; color: var(--ink-2); }
  .pw.polished .sp-nm { font-size: 50px; }
  .pw.polished .sp-rows { font-size: 13px; grid-template-columns: 96px minmax(0, 1fr); --gut: 12px; }
  /* A strip beside a label (Noah, October 19): as tall as the label's capitals and sitting on its baseline, it runs to the
     card's edge, or to the middle of the value column when it holds one color. A palette's strip takes the right half,
     and Similar's squares are cap height on their line's baseline too. */
  .pw.polished .sp-rows .here { display: inline-flex; vertical-align: baseline; width: 100%; max-width: none; height: 1cap; }
  .pw.polished .sp-rows .here.one { width: calc((100% - var(--gut)) / 2); }
  .pw.polished .sp-rows .here button:hover { position: relative; z-index: 1; box-shadow: 0 0 0 1.5px #fff, 0 0 0 2.5px #1d1d1f; }
  .pw.polished .sp-pal { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 var(--gut); align-items: first baseline; }
  .pw.polished .sp-pal .sp-strip { height: 1cap; }
  .pw.polished .sim button { grid-template-columns: 1cap minmax(0, 1fr); align-items: first baseline; }
  .pw.polished .sim i { width: 1cap; height: 1cap; }
  /* The scratch pad says things about a color, so it takes 11, on rules 18px apart */
  .pw.polished .pad textarea { height: 54px; font-size: 11px; line-height: 18px; background: repeating-linear-gradient(transparent 0 17px, var(--rule-soft) 17px 18px); }
  .pw.polished .pad textarea::placeholder { color: var(--ink-2); }
  .pw.polished .sc-names div { font-size: 13px; }
  .pw.polished .sc-foot .tt { font-size: 26px; }

  /* One gray: everything said about a color in ink-2; one lighter gray for what can't be pressed yet */
  .pw.polished .letters button:disabled, .pw.polished .wheel:disabled, .pw.polished .zoom > button:disabled { color: var(--off); }
  .pw.polished .trail .sep { color: var(--ink-2); }
  .pw.polished .tres b.ph { opacity: 1; color: var(--ink-2); }
  body.polished .menu .mi:disabled { color: var(--off); }

  /* One left edge: the traffic lights, the letters, the dates and the colors all start 20px in */
  .pw.polished .bar { padding-left: 20px; padding-right: 20px; }
  .pw.polished .hrow { padding: 0 20px 0 10px; }
  .pw.polished .days { padding-left: 20px; padding-right: 20px; }
  .pw.polished .pals, .pw.polished .study, .pw.polished .res { padding-left: 20px; padding-right: 20px; }
  .pw.polished .fan-cap { left: 20px; }
  .pw.polished .table .tback, .pw.polished .table .hint { left: 20px; }

  /* Nothing on the colors: the row's end holds the count, what just happened, the zoom's stop and what you've gathered */
  .rowend { margin-left: auto; display: flex; align-items: center; gap: 14px; min-width: 0; padding-left: 16px; }
  .rowend.busy .pw-count { display: none; }
  .rowmsg { display: flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; animation: fadeIn var(--move) var(--ease) both; }
  .rowmsg.out { animation: fadeOut var(--move) var(--ease) both; }
  .rowmsg .ms { display: flex; height: 14px; }
  .rowmsg .ms i { width: 12px; }
  .rowsel { display: flex; align-items: center; gap: 6px; animation: fadeIn var(--move) var(--ease) both; }
  .rowsel .ss { display: flex; height: 14px; margin-right: 2px; }
  .rowsel .ss i { width: 12px; }
  .rowsel .sn { font-size: 13px; color: var(--ink-2); margin-right: 6px; white-space: nowrap; }
  .pw.polished .hrow .pw-count.inrow { font-size: 11px; }

  /* Nothing cut off: names, places and file names wrap instead */
  .pw.polished .t .nm, .pw.polished .nm small, .pw.polished .lbl, .pw.polished .pg .w, .pw.polished .chip .nm,
  .pw.polished .tres b, .pw.polished .tres span, .pw.polished .sp-pal .pl, .pw.polished .sc-names b { white-space: normal; text-overflow: clip; overflow-wrap: anywhere; }
  .pw.polished .pls { align-items: flex-end; }
  body.polished .menu .mi { height: auto; min-height: 24px; padding-top: 3px; padding-bottom: 3px; white-space: normal; }
  body.polished .menu .lb { overflow: visible; text-overflow: clip; }

  /* In Spectrum, the chosen color's name is yours to change right there (A98) */
  .fan-cap .nm { pointer-events: auto; outline: none; border-radius: 3px; cursor: text; min-width: 60px; overflow-wrap: anywhere; }
  .fan-cap .nm:empty::before { content: attr(data-placeholder); color: var(--ink-2); }
  .fan-cap .nm:hover { box-shadow: 0 0 0 2px rgba(29, 29, 31, 0.06); }
  .fan-cap .nm:focus { box-shadow: 0 0 0 2px rgba(29, 29, 31, 0.12); }

  /* Pointing at a color (entry 170): it widens a little and shows its number, top left, and nothing else. The old hover
     never reached the rows, since .row .t set flex-grow after it; these rules are specific enough to win. */
  .t .tno { position: absolute; left: 10px; top: 8px; font-size: 11px; line-height: 1; opacity: 0; pointer-events: none; }
  .pw.polished .t .tno { transition: opacity var(--move) var(--ease); }
  .pw.polished .t:hover .tno, .pw.polished .t:focus-visible .tno, .pw.polished .t.phover .tno { opacity: 0.72; }
  /* The width comes from hoverGrow(): 6% over the color's own width in every row. Here, the old hover's grow stays off. */
  .pw.polished .t { transition: flex-grow var(--move) var(--ease), max-width var(--move) var(--ease); }
  .pw.polished .row .t:hover, .pw.polished .row .t:focus-visible, .pw.polished .t.phover { flex-grow: 1; }

  /* The desktop palette, detachable (entry 171): drag it off the edge and it floats where you leave it, above the window,
     every color showing; drop it near either edge and it docks there. The grip shows when you point at the palette. */
  .strips { touch-action: none; }
  .strips .grip { align-self: center; width: 14px; height: 3px; margin: 0 0 4px; border-radius: 2px; background: rgba(0, 0, 0, 0.24); cursor: grab; opacity: 0; transition: opacity 240ms cubic-bezier(.2, .8, .2, 1); }
  .strips:hover .grip, .strips.float .grip, .strips.dragging .grip, .strips.open .grip { opacity: 1; }
  .strips.left { right: auto; left: 0; border-radius: 0 10px 10px 0; }
  .strips.float { right: auto; transform: none; z-index: 30; border-radius: 10px; }
  .strips.float button { width: 26px; }
  .strips.dragging { cursor: grabbing; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22), 0 0 0 0.5px rgba(0, 0, 0, 0.2); }
  .strips.dragging button, .strips.dragging .grip { cursor: grabbing; }

  /* The new logo, when it's in (entry 173): as a shape filled with the last color you kept, or as it is */
  .mbi .mark.shaped { width: 16px; height: 16px; box-shadow: none; -webkit-mask: var(--mark-url) center / contain no-repeat; mask: var(--mark-url) center / contain no-repeat; }
  .mbi .mark.image { width: 16px; height: 16px; box-shadow: none; background: var(--mark-url) center / contain no-repeat; }

  .pw.polished .pg .cs > div { transition: flex-grow var(--move) var(--ease), max-width var(--move) var(--ease); }

  .pw.polished .t, .pw.polished .pg .cs > div { transition: flex-grow var(--move) var(--ease), max-width var(--move) var(--ease), width var(--move) var(--ease); }

  /* The demo's labels (the script's on-screen text): one quiet line at the top of the desk, under the menu bar */
  /* The playback's label (the personas, entry 216) sits top left, clear of v3's own centered pills */
  .plabel { position: absolute; left: 28px; top: 40px; z-index: 96; padding: 8px 18px; background: rgba(255, 255, 255, 0.96); border-radius: 9px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16), 0 0 0 0.5px rgba(0, 0, 0, 0.18); font-size: 22px; letter-spacing: -0.01em; color: #1d1d1f; opacity: 0; transition: opacity 240ms cubic-bezier(.2, .8, .2, 1); pointer-events: none; }
  .plabel.on { opacity: 1; }
  .mbi.phover { background: rgba(0, 0, 0, 0.1); }

  /* ---------- The demo, after Noah's notes on it (October 20) ---------- */
  /* The keys come in one at a time, in the order they're pressed, and stay a little longer for the viewer */
  .pkeys.seq kbd { animation: kin 220ms cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes kin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  /* The cursor fades in once the camera has pulled back from the menu bar */
  .pcursor { transition: opacity 360ms cubic-bezier(.2, .8, .2, 1); }
  .pcursor.ghost { opacity: 0; }
  /* Kept, at the edge: the desktop palette bumps as the color lands, then the menu bar's square as it takes the color.
     Round two (Noah, October 20: "the initial bump for the color coming into the side chip feels a little off? Can we make it
     more elegant, with a smoother animation? Feel free to take slightly more time animating the bumps."): a bump is a slow
     swell and a soft settle, 1 to 1.04 to 0.996 and back over about 800ms, each turn starting and stopping with no jolt, so
     nothing snaps. The square, being so small, swells a little more. Docked, the palette is moved up by half its height, so a
     scale about its top edge keeps it centered where it sits and against the edge. */
  .strips.bump { animation: bump-strips 800ms both; transform-origin: 100% 0; }
  .strips.left.bump { transform-origin: 0 0; }
  .strips.float.bump { transform-origin: 50% 50%; }
  @keyframes bump-strips { 0% { scale: 1; animation-timing-function: cubic-bezier(.33, 0, .2, 1); } 34% { scale: 1.04; animation-timing-function: cubic-bezier(.45, 0, .55, 1); } 70% { scale: 0.996; animation-timing-function: cubic-bezier(.45, 0, .55, 1); } 100% { scale: 1; } }
  .mbi .mark.bump { animation: bump-mark 800ms both; }
  @keyframes bump-mark { 0% { scale: 1; animation-timing-function: cubic-bezier(.33, 0, .2, 1); } 34% { scale: 1.18; animation-timing-function: cubic-bezier(.45, 0, .55, 1); } 70% { scale: 0.985; animation-timing-function: cubic-bezier(.45, 0, .55, 1); } 100% { scale: 1; } }

  /* The menu bar's clock, drawn (Noah, October 20: "I also don't know why we're working with a screenshot of the prior
     version - redo the demo recording if needed, to make it as crisp and clean as possible"). Close on the square, the desk's
     own clock was a photo blown up about eight times. While a playback shows, a patch of the bar's own color (sampled from
     the desk, drawClock) covers it, and the clock is set over it the way the Mac sets it, matched against the screenshot at
     2x: SF Pro at 13, regular, 85% black, the time's colon raised ("case"), each part where the screenshot has it. */
  /* It covers only the band the letters sit in, its left and bottom edges softened, so the bar's own edge stays the photo's */
  .mbclock { position: absolute; left: 1291px; top: 0; width: 149px; height: 21px; z-index: 24; pointer-events: none; display: none;
    -webkit-mask: linear-gradient(to right, transparent, #000 4px), linear-gradient(to bottom, #000 18px, transparent 21px); -webkit-mask-composite: source-in;
    mask: linear-gradient(to right, transparent, #000 4px), linear-gradient(to bottom, #000 18px, transparent 21px); mask-composite: intersect; }
  body.mbclock-on .mbclock { display: block; }
  .mbclock[hidden] { display: none !important; }
  .mbclock span { position: absolute; top: 4px; font: 400 13px/normal var(--font); letter-spacing: 0.001em; color: rgba(0, 0, 0, 0.85); white-space: pre; font-feature-settings: "case"; }

  /* The specimen card and the share card rise a little as they come in (Noah, October 20: "I think the color card could
     slightly slide up when it fades in, just to give it a more elevated look"), and rise out as they go */
  @keyframes cardIn { from { transform: translateY(16px); } }
  @keyframes cardOut { to { transform: translateY(-8px); } }
  .pw.polished .sheet > .spec, .pw.polished .sheet > .share { animation: cardIn var(--move) var(--ease) both; }
  .pw.polished .sheet.out > .spec, .pw.polished .sheet.out > .share { animation: cardOut var(--move) var(--ease) both; }
  /* One way in and one way out for the playback (Noah: "try to find a direction and stick to it"): the same moves as the app,
     slower and softer, on a long ease-out coming in and a quicker ease going. --k is the beat's pace (LOCAL). Only the times
     change here, never the animations themselves, so starting or stopping the playback replays nothing. */
  body.playing .pw.polished, body.playing .pw.polished .sheet, body.playing .pw.polished .sheet > .spec, body.playing .pw.polished .sheet > .share { animation-duration: calc(540ms * var(--k, 1)); animation-timing-function: cubic-bezier(.22, 1, .36, 1); }
  body.playing .pw.polished.out, body.playing .pw.polished .sheet.out, body.playing .pw.polished .sheet.out > .spec, body.playing .pw.polished .sheet.out > .share { animation-duration: calc(300ms * var(--k, 1)); animation-timing-function: cubic-bezier(.4, 0, 1, 1); }
  body.playing .pw.polished .table.named .chip .nm { animation-duration: calc(480ms * var(--k, 1)); animation-timing-function: cubic-bezier(.22, 1, .36, 1); }
  /* Show names on the table: the names fade in, the way everything else comes in */
  .pw.polished .table.named .chip .nm { animation: fadeIn var(--move) var(--ease) both; }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage" aria-label="Palit v2 on a Mac desktop">
    <img id="desk" alt="A Mac desktop with a Wikipedia article in Safari and a photo open in Preview" draggable="false">
    <button type="button" class="mbi" id="mbi" aria-expanded="false" aria-label="Palit"><span class="mark" id="mark" aria-hidden="true"></span></button>
    <div class="strips" id="strips" role="toolbar" aria-label="Desktop palette"></div>
    <section class="pw" id="pw" hidden aria-label="Palit">
      <div class="bar">
        <div class="lights"><button type="button" id="pw-close" aria-label="Close Palit"></button><button type="button" aria-label="Minimize" tabindex="-1"></button><button type="button" aria-label="Zoom" tabindex="-1"></button></div>
        <div class="hue"><div class="letters" id="letters" role="group" aria-label="Filter by hue"></div><button type="button" class="wheel" id="wheel" aria-pressed="false" aria-label="All colors, by hue" title="All colors, by hue"><svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle class="hub" cx="9" cy="9" r="2.6" fill="none"/></svg></button></div>
        <div class="tabs" id="tabs" role="group" aria-label="View"></div>
        <label class="search"><input id="q" type="search" placeholder="Search" aria-label="Search your colors by name, place, code or note" spellcheck="false" autocomplete="off"></label>
        <div class="zoom" id="zoom" role="group" aria-label="Zoom"><button type="button" id="z-out" aria-label="Zoom out" title="Zoom out  ⌘−">−</button><span class="zdots" id="zdots" role="group" aria-label="Zoom stops"></span><button type="button" id="z-in" aria-label="Zoom in" title="Zoom in  ⌘+">+</button></div>
      </div>
      <div class="hrow" id="hrow" hidden></div>
      <div class="main" id="main">
        <nav class="rail" id="rail" aria-label="Days of the week"></nav>
        <div class="pw-body" id="body"></div>
      </div>
      <p class="pw-count num" id="count" aria-live="polite"></p>
    </section>
  </div>
</div>

<div id="controls">
  <div class="c-row">
    <label class="c-lb" for="c-screen">Screen</label><select class="c-sel" id="c-screen"></select>
    <span class="c-lb">Sound</span><span class="c-seg" id="c-sound"></span>
    <button type="button" class="c-btn" id="c-play">Play<kbd>P</kbd></button>
    <button type="button" class="c-btn" id="c-keys" aria-pressed="true">Keystrokes<kbd>K</kbd></button>
    <button type="button" class="c-btn" id="c-reset">Start over</button>
    <button type="button" class="c-btn" id="c-hide">Hide<kbd>H</kbd></button>
  </div>
  <div class="c-row c-row2"><p class="c-hint"><b>⌥⇧C</b>, then click any color to keep it; right-click to name it, hold <b>⇧</b> to keep a palette. Click Palit in the menu bar: <b>⌘−</b> <b>⌘+</b> zoom from only color to the whole hunt, the ring shows all colors by hue, right-click any color to take it to the table, <b>⇧</b>-click gathers. <b>P</b> plays the demo; Esc stops it.</p><span class="c-credit" id="c-credit"></span></div>
</div>

<script src="../system/sample.js"></script>
<script src="archive.js"></script>
<script src="../brand/brand.js"></script>
<script src="../system/color.js"></script>
<script src="../system/components.js"></script>
<script src="../v2/screens/screens.js"></script>
<script>
(function () {
  "use strict";
  var S = window.PALIT_SAMPLE, PC = window.PalitColor, U = window.PalitUI, SCREENS = (window.PALIT_V2_SCREENS || {}).list || [];
  var el = U.el, pad = U.pad, no = U.no;
  function $(id) { return document.getElementById(id); }
  var W = 1440, H = 900, TODAY = "October 18";
  var q = new URLSearchParams(location.search);
  if (q.has("clean")) document.body.classList.add("clean");

  /* ---------- Color ---------- */
  function lum(hex) {
    var v = [1, 3, 5].map(function (i) { var c = parseInt(hex.slice(i, i + 2), 16) / 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); });
    return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
  }
  var INK_L = lum("#1d1d1f");
  function inkOn(hex) { var l = lum(hex); return 1.05 / (l + 0.05) >= (l + 0.05) / (INK_L + 0.05) ? "#ffffff" : "#1d1d1f"; }
  // Copy quietly: the clipboard refuses when the page isn't focused, as during playback.
  function copy(text) { try { var p = navigator.clipboard.writeText(text); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
  function toHex(r, g, b) { return "#" + [r, g, b].map(function (v) { return ("0" + v.toString(16)).slice(-2); }).join(""); }
  // ROYGBIV, strictly seven letters (A58). Neutrals have no letter; they show when no letter is picked.
  var LETTERS = [["R", "Red", "#b5462e"], ["O", "Orange", "#d9822b"], ["Y", "Yellow", "#e2b93b"], ["G", "Green", "#6e9a5a"], ["B", "Blue", "#3f78a8"], ["I", "Indigo", "#4b4fa0"], ["V", "Violet", "#7a5aa6"]];
  function bandOf(c) {
    if (c.C < 0.03) return null;
    var h = c.h;
    return h < 40 || h >= 350 ? "R" : h < 75 ? "O" : h < 115 ? "Y" : h < 190 ? "G" : h < 265 ? "B" : h < 290 ? "I" : "V";
  }
  function hueKey(c) { var b = bandOf(c); return b ? "ROYGBIV".indexOf(b) * 1000 + ((c.h + 10) % 360) : 9000 - c.L * 100; }

  /* ---------- Sounds: duller than the old chime (A63). Pick one by ear (Q22). ---------- */
  var actx = null, noiseBuf = null;
  function audio() {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (!noiseBuf) { noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.2, actx.sampleRate); var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    return actx;
  }
  function env(g, t, peak, attack, decay) { g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay); }
  function noise(ctx, t, freq, q, peak, decay, out) {
    var n = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    n.buffer = noiseBuf; f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q;
    env(g, t, peak, 0.002, decay); n.connect(f); f.connect(g); g.connect(out); n.start(t); n.stop(t + decay + 0.05);
  }
  var SOUNDS = {
    felt: { label: "Felt", play: function (ctx, t, out) {   // a soft, low, rounded note
      var lp = ctx.createBiquadFilter(), g = ctx.createGain(); lp.type = "lowpass"; lp.frequency.value = 1000; env(g, t, 0.2, 0.006, 0.34);
      [[392, 1], [784, 0.16]].forEach(function (p) { var o = ctx.createOscillator(), og = ctx.createGain(); o.type = "sine"; o.frequency.value = p[0]; og.gain.value = p[1]; o.connect(og); og.connect(lp); o.start(t); o.stop(t + 0.4); });
      lp.connect(g); g.connect(out);
    } },
    wood: { label: "Wood", play: function (ctx, t, out) {   // a short, dry tock
      var o = ctx.createOscillator(), g = ctx.createGain(); o.type = "triangle";
      o.frequency.setValueAtTime(640, t); o.frequency.exponentialRampToValueAtTime(390, t + 0.05);
      env(g, t, 0.26, 0.002, 0.11); o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.15);
      noise(ctx, t, 2400, 1.2, 0.05, 0.014, out);
    } },
    stamp: { label: "Stamp", play: function (ctx, t, out) {   // a soft press on paper
      var o = ctx.createOscillator(), g = ctx.createGain(); o.type = "sine";
      o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(82, t + 0.07);
      env(g, t, 0.34, 0.003, 0.15); o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.2);
      noise(ctx, t, 900, 0.8, 0.07, 0.06, out);
    } },
    off: { label: "Off", play: null }
  };
  function sound() { var s = SOUNDS[st.sound]; if (!s || !s.play) return; try { var ctx = audio(), out = ctx.createGain(); out.gain.value = 0.9; out.connect(ctx.destination); s.play(ctx, ctx.currentTime + 0.01, out); } catch (e) {} }

  /* ---------- The real screens ---------- */
  var stage = $("stage"), desk = $("desk"), canvases = {}, loading = {};
  // A desk is decoded the first time it's needed (seeded desks at startup, the rest when shown), once, however many ask
  function canvasFor(sc, done) {
    if (canvases[sc.id]) { done(canvases[sc.id]); return; }
    if (loading[sc.id]) { loading[sc.id].push(done); return; }
    loading[sc.id] = [done];
